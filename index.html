<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <title>Nakupny zoznam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #7c3aed;
      --bg-2: #38bdf8;
      --bg-3: #f472b6;
      --panel: rgba(255, 255, 255, 0.9);
      --panel-strong: rgba(255, 255, 255, 0.97);
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(148, 163, 184, 0.22);
      --shadow: 0 20px 45px rgba(15, 23, 42, 0.22);
      --accent: #0ea5e9;
      --accent-strong: #0284c7;
      --success: #16a34a;
      --danger: #ef4444;
      --chip: rgba(226, 232, 240, 0.88);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(244, 114, 182, 0.9), transparent 34%),
        radial-gradient(circle at top right, rgba(56, 189, 248, 0.9), transparent 34%),
        radial-gradient(circle at bottom left, rgba(250, 204, 21, 0.55), transparent 30%),
        linear-gradient(135deg, #0f172a, #1e1b4b 45%, #164e63);
      padding: 18px 12px 26px;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .shell {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 250, 252, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 30px;
      box-shadow: 0 24px 48px rgba(15, 23, 42, 0.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      overflow: hidden;
    }

    .header {
      padding: 22px 20px 10px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .title {
      margin: 0;
      font-family: "Baloo 2", system-ui, sans-serif;
      font-size: 2.05rem;
      line-height: 1;
      letter-spacing: 0.03em;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .sync-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      padding: 4px 20px 0;
    }

    .status-pill {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(255, 255, 255, 0.78);
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
    }

    .status-pill::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #94a3b8;
      box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.16);
    }

    .status-pill.loading::before {
      background: #f59e0b;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.18);
    }

    .status-pill.synced::before {
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.18);
    }

    .status-pill.saving::before {
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.18);
    }

    .status-pill.error::before {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.18);
    }

    .sync-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn,
    .btn-small,
    .btn-text,
    .item-delete {
      appearance: none;
      border: none;
      cursor: pointer;
      font: inherit;
    }

    .btn,
    .btn-small {
      min-height: 40px;
      padding: 0 15px;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: 0.01em;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      box-shadow: 0 10px 22px rgba(14, 165, 233, 0.18);
    }

    .btn.alt {
      background: linear-gradient(135deg, #475569, #334155);
      box-shadow: 0 10px 22px rgba(51, 65, 85, 0.14);
    }

    .btn-soft {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: var(--text);
      box-shadow: none;
    }

    .btn:active,
    .btn-small:active,
    .item-delete:active,
    .btn-text:active {
      transform: translateY(1px) scale(0.98);
    }

    .device-button {
      background: rgba(15, 23, 42, 0.08);
      color: var(--text);
      box-shadow: none;
    }

    .add-card,
    .toolbar {
      padding: 12px 20px 0;
    }

    .add-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: stretch;
    }

    .input {
      width: 100%;
      min-width: 0;
      border: 1px solid rgba(203, 213, 225, 0.72);
      border-radius: 18px;
      padding: 14px 16px;
      font: inherit;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
    }

    .input:focus {
      outline: 2px solid rgba(14, 165, 233, 0.18);
      border-color: var(--accent);
    }

    .toolbar-grid {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-small {
      min-height: 36px;
      padding: 0 14px;
      font-size: 0.84rem;
    }

    .btn-text {
      background: transparent;
      color: var(--danger);
      text-decoration: underline;
      font-size: 0.84rem;
      font-weight: 700;
      padding: 4px 0;
    }

    .list-wrapper {
      padding: 2px 20px 20px;
    }

    .pull-indicator {
      height: 0;
      opacity: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--muted);
      transition: height 0.18s ease, opacity 0.18s ease;
    }

    .pull-indicator.active {
      height: 42px;
      opacity: 1;
    }

    .list {
      min-height: 300px;
      max-height: min(66vh, 720px);
      overflow-y: auto;
      padding: 0 1px 0 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overscroll-behavior-y: contain;
    }

    .list::-webkit-scrollbar {
      width: 6px;
    }

    .list::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.6);
      border-radius: 999px;
    }

    .group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 4px 0;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .group-title::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12);
    }

    .group-title.done::before {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
    }

    .item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px 14px 14px 12px;
      border-radius: 18px;
      border: 1px solid rgba(226, 232, 240, 0.82);
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.06);
      cursor: pointer;
    }

    .item.bought {
      background: linear-gradient(135deg, rgba(236, 253, 245, 0.98), rgba(220, 252, 231, 0.98));
      border-color: rgba(134, 239, 172, 0.95);
    }

    .item-check {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      border: 2px solid rgba(148, 163, 184, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 900;
      color: transparent;
      background: rgba(255, 255, 255, 0.88);
      flex-shrink: 0;
    }

    .item.bought .item-check {
      color: #fff;
      border-color: var(--success);
      background: linear-gradient(135deg, #22c55e, #16a34a);
    }

    .item-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-name {
      font-size: 1.05rem;
      font-weight: 800;
      word-break: break-word;
    }

    .item.bought .item-name {
      text-decoration: line-through;
      color: #166534;
    }

    .item-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 9px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
    }

    .chip.source {
      background: rgba(224, 242, 254, 0.98);
      color: #075985;
    }

    .item-delete {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: rgba(254, 226, 226, 0.8);
      color: #b91c1c;
      font-size: 0.84rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    .empty {
      min-height: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.56);
      border: 1px dashed rgba(148, 163, 184, 0.35);
      border-radius: 24px;
      padding: 22px;
    }

    .empty-title {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--text);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(120%);
      opacity: 0;
      background: rgba(15, 23, 42, 0.96);
      color: #fff;
      padding: 11px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.28);
      transition: transform 0.2s ease, opacity 0.2s ease;
      z-index: 50;
      max-width: calc(100vw - 28px);
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px 10px 18px;
      }

      .header-row,
      .sync-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .header-actions,
      .sync-actions {
        justify-content: stretch;
      }

      .header-actions > *,
      .sync-actions > * {
        width: 100%;
      }

      .add-form {
        grid-template-columns: 1fr;
      }

      .btn,
      .btn-small,
      .device-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="shell">
      <header class="header">
        <div class="header-row">
          <div>
            <h1 class="title">Nakupny zoznam</h1>
            <div class="subtitle" id="device-summary">Zariadenie nie je nastavene</div>
          </div>
          <div class="header-actions">
            <button type="button" class="btn btn-soft device-button" id="btn-device">Zariadenie</button>
          </div>
        </div>
      </header>

      <section class="sync-bar">
        <div class="status-pill" id="sync-status-pill">
          <span id="sync-status-text">Pripravene</span>
        </div>
        <div class="sync-actions">
          <button type="button" class="btn btn-soft" id="btn-load">Nacitat</button>
          <button type="button" class="btn" id="btn-save">Ulozit</button>
        </div>
      </section>

      <section class="add-card">
        <form class="add-form" id="add-form">
          <input class="input" id="input-name" type="text" autocomplete="off" placeholder="Co treba kupit?" />
          <button type="submit" class="btn">Pridat</button>
        </form>
      </section>

      <section class="toolbar">
        <div class="toolbar-grid">
          <button type="button" class="btn-small btn-soft" id="btn-mark-all">Oznacit vsetko</button>
          <button type="button" class="btn-small btn-soft" id="btn-clear-checked">Vymazat odskrtnute</button>
        </div>
      </section>

      <section class="list-wrapper">
        <div class="pull-indicator" id="pull-indicator">Potiahni dole pre nacitanie</div>
        <div class="list" id="list"></div>
      </section>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "nakupnyZoznam_neonMEGA_items";
    const SYNC_KEY = "nakupnyZoznam_neonMEGA_sync_ts";
    const DEVICE_KEY = "nakupny_zoznam_device_v2";
    const UNSAVED_KEY = "nakupny_zoznam_unsaved_v2";
    const PULL_THRESHOLD = 78;
    const SHEETS_SYNC_URL = "https://script.google.com/macros/s/AKfycbw260UlklkZ4KEtiTvfHtvRr_z3R1Te5Ne3Foch9e38nBuWaeo1Y9eRY7dLKqONmyquFg/exec";

    const state = {
      items: [],
      syncInProgress: false,
      unsaved: localStorage.getItem(UNSAVED_KEY) === "1",
      pull: null,
      toastTimer: null
    };

    const device = loadDevice();

    function uid() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }

      return "id-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function nowIso() {
      return new Date().toISOString();
    }

    function detectDeviceType() {
      const ua = (navigator.userAgent || "").toLowerCase();
      return /android|iphone|ipad|ipod|mobile/i.test(ua) ? "mobile" : "desktop";
    }

    function defaultDeviceLabel(type) {
      return type === "mobile" ? "Mobil" : "PC";
    }

    function loadDevice() {
      const fallbackType = detectDeviceType();

      try {
        const raw = localStorage.getItem(DEVICE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        const loaded = {
          id: parsed && parsed.id ? String(parsed.id) : uid(),
          type: parsed && parsed.type ? String(parsed.type) : fallbackType,
          label: parsed && parsed.label ? String(parsed.label) : defaultDeviceLabel(fallbackType)
        };
        localStorage.setItem(DEVICE_KEY, JSON.stringify(loaded));
        return loaded;
      } catch (error) {
        const loaded = {
          id: uid(),
          type: fallbackType,
          label: defaultDeviceLabel(fallbackType)
        };
        localStorage.setItem(DEVICE_KEY, JSON.stringify(loaded));
        return loaded;
      }
    }

    function saveDevice() {
      localStorage.setItem(DEVICE_KEY, JSON.stringify(device));
    }

    function loadLocalItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return normalizeItems(parsed);
      } catch (error) {
        return [];
      }
    }

    function normalizeItems(items) {
      if (!Array.isArray(items)) return [];

      const merged = new Map();

      items
        .filter(item => item && typeof item.name === "string" && item.name.trim())
        .forEach((item, index) => {
          const normalized = {
            id: item.id ? String(item.id) : uid(),
            name: String(item.name || "").trim(),
            bought: Boolean(item.bought),
            boughtAt: item.boughtAt ? String(item.boughtAt) : null,
            updatedAt: item.updatedAt ? String(item.updatedAt) : (item.boughtAt ? String(item.boughtAt) : "1970-01-01T00:00:00.000Z"),
            order: Number.isFinite(Number(item.order)) ? Number(item.order) : index,
            deleted: item.deleted === true,
            updatedById: item.updatedById ? String(item.updatedById) : "",
            updatedByType: item.updatedByType === "mobile" ? "mobile" : (item.updatedByType === "desktop" ? "desktop" : ""),
            updatedByLabel: item.updatedByLabel ? String(item.updatedByLabel) : ""
          };

          const current = merged.get(normalized.id);
          if (!current) {
            merged.set(normalized.id, normalized);
            return;
          }

          const currentTime = current.updatedAt ? new Date(current.updatedAt).getTime() : 0;
          const nextTime = normalized.updatedAt ? new Date(normalized.updatedAt).getTime() : 0;
          if (nextTime >= currentTime) {
            merged.set(normalized.id, normalized);
          }
        });

      return Array.from(merged.values()).sort((a, b) => {
        if (a.order !== b.order) {
          return a.order - b.order;
        }

        const aTime = a.updatedAt ? new Date(a.updatedAt).getTime() : 0;
        const bTime = b.updatedAt ? new Date(b.updatedAt).getTime() : 0;
        return bTime - aTime;
      });
    }

    function visibleItems() {
      return normalizeItems(state.items).filter(item => !item.deleted);
    }

    function persistItems() {
      state.items = normalizeItems(state.items);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items));
    }

    function stampItem(item, timestamp) {
      if (!item) return item;

      item.updatedAt = timestamp || nowIso();
      item.updatedById = device.id;
      item.updatedByType = device.type;
      item.updatedByLabel = device.label;
      return item;
    }

    function sourceText(item) {
      if (!item || !item.updatedById || item.updatedById === device.id) {
        return "";
      }

      if (item.updatedByLabel) {
        return "Od " + item.updatedByLabel;
      }

      return item.updatedByType === "mobile" ? "Z mobilu" : "Z PC";
    }

    function formatDate(value) {
      if (!value) return "";

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";

      return date.toLocaleString("sk-SK", {
        day: "2-digit",
        month: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function setUnsaved(flag) {
      state.unsaved = Boolean(flag);
      if (state.unsaved) {
        localStorage.setItem(UNSAVED_KEY, "1");
      } else {
        localStorage.removeItem(UNSAVED_KEY);
      }
      updateStatusFromState();
    }

    function setStatus(mode, text) {
      const pill = document.getElementById("sync-status-pill");
      const label = document.getElementById("sync-status-text");
      if (!pill || !label) return;

      pill.classList.remove("loading", "synced", "saving", "error");
      if (mode) {
        pill.classList.add(mode);
      }
      label.textContent = text;
    }

    function updateStatusFromState() {
      if (state.syncInProgress) return;

      if (state.unsaved) {
        setStatus("saving", "Neulozene zmeny");
        return;
      }

      if (localStorage.getItem(SYNC_KEY)) {
        setStatus("synced", "Ulozene");
        return;
      }

      setStatus("", "Pripravene");
    }

    function touchSyncSuccess() {
      localStorage.setItem(SYNC_KEY, nowIso());
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      if (!toast) return;

      toast.textContent = message;
      toast.classList.add("show");

      if (state.toastTimer) {
        clearTimeout(state.toastTimer);
      }

      state.toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1800);
    }

    function updateDeviceUi() {
      const summary = document.getElementById("device-summary");
      const headerButton = document.getElementById("btn-device");
      const label = device.label || defaultDeviceLabel(device.type);
      const typeText = device.type === "mobile" ? "mobil" : "PC";

      if (summary) {
        summary.textContent = "Toto zariadenie: " + label + " (" + typeText + ")";
      }

      if (headerButton) {
        headerButton.textContent = "Zariadenie: " + label;
      }
    }

    function promptForDeviceName() {
      const suggested = device.label && device.label !== defaultDeviceLabel(device.type)
        ? device.label
        : (device.type === "mobile" ? "Domi" : "Peto");
      const raw = window.prompt("Nazov zariadenia", suggested);
      if (raw === null) return;

      const next = raw.trim().slice(0, 24);
      if (!next) {
        showToast("Nazov ostal bez zmeny.");
        return;
      }

      device.label = next;
      saveDevice();
      updateDeviceUi();
      showToast("Zariadenie nastavene.");
    }

    function renderGroup(container, title, className, items) {
      if (!items.length) return;

      const heading = document.createElement("div");
      heading.className = "group-title" + (className ? " " + className : "");
      heading.textContent = title;
      container.appendChild(heading);

      items.forEach(item => {
        container.appendChild(renderItem(item));
      });
    }

    function renderItem(item) {
      const card = document.createElement("div");
      card.className = "item" + (item.bought ? " bought" : "");
      card.dataset.id = item.id;

      card.addEventListener("click", event => {
        if (event.target.closest("button")) return;
        toggleBought(item.id);
      });

      const check = document.createElement("div");
      check.className = "item-check";
      check.textContent = item.bought ? "OK" : "";

      const main = document.createElement("div");
      main.className = "item-main";

      const name = document.createElement("div");
      name.className = "item-name";
      name.textContent = item.name;
      main.appendChild(name);

      const meta = document.createElement("div");
      meta.className = "item-meta";

      const source = sourceText(item);
      if (source) {
        const sourceChip = document.createElement("div");
        sourceChip.className = "chip source";
        sourceChip.textContent = source;
        meta.appendChild(sourceChip);
      }

      if (item.bought && item.boughtAt) {
        const boughtChip = document.createElement("div");
        boughtChip.className = "chip";
        boughtChip.textContent = formatDate(item.boughtAt);
        meta.appendChild(boughtChip);
      }

      if (meta.children.length) {
        main.appendChild(meta);
      }

      const del = document.createElement("button");
      del.type = "button";
      del.className = "item-delete";
      del.textContent = "X";
      del.addEventListener("click", event => {
        event.stopPropagation();
        deleteSingle(item.id);
      });

      card.appendChild(check);
      card.appendChild(main);
      card.appendChild(del);
      return card;
    }

    function render() {
      const list = document.getElementById("list");
      if (!list) return;

      list.innerHTML = "";
      const items = visibleItems();

      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML = [
          '<div class="empty-title">Zoznam je prazdny</div>',
          '<div>Pridaj prvu polozku alebo nacitaj data zo Sheets.</div>'
        ].join("");
        list.appendChild(empty);
        return;
      }

      const open = items.filter(item => !item.bought);
      const done = items.filter(item => item.bought);

      renderGroup(list, "Kupit", "", open);
      renderGroup(list, "Kupene", "done", done);
    }

    function nextTopOrder() {
      const items = visibleItems();
      if (!items.length) return 0;
      return Math.min(...items.map(item => Number.isFinite(Number(item.order)) ? Number(item.order) : 0)) - 1;
    }

    function addItem(name) {
      const clean = String(name || "").trim();
      if (!clean) {
        showToast("Napis, co treba kupit.");
        return;
      }

      state.items.unshift(stampItem({
        id: uid(),
        name: clean,
        bought: false,
        boughtAt: null,
        deleted: false,
        order: nextTopOrder()
      }));

      persistItems();
      setUnsaved(true);
      render();
      showToast("Polozka pridana.");
    }

    function toggleBought(id) {
      const item = state.items.find(entry => entry.id === id);
      if (!item || item.deleted) return;

      const timestamp = nowIso();
      item.bought = !item.bought;
      item.boughtAt = item.bought ? timestamp : null;
      stampItem(item, timestamp);
      persistItems();
      setUnsaved(true);
      render();
    }

    function deleteSingle(id) {
      const item = state.items.find(entry => entry.id === id);
      if (!item || item.deleted) return;

      item.deleted = true;
      stampItem(item);
      persistItems();
      setUnsaved(true);
      render();
      showToast("Polozka vymazana.");
    }

    function markAllBought() {
      const items = visibleItems().filter(item => !item.bought);
      if (!items.length) {
        showToast("Nie je co oznacit.");
        return;
      }

      const timestamp = nowIso();
      items.forEach(item => {
        item.bought = true;
        item.boughtAt = timestamp;
        stampItem(item, timestamp);
      });

      persistItems();
      setUnsaved(true);
      render();
      showToast("Vsetko je oznacene.");
    }

    function clearChecked() {
      const items = state.items.filter(item => item && item.bought && !item.deleted);
      if (!items.length) {
        showToast("Nie je co vymazat.");
        return;
      }

      const timestamp = nowIso();
      items.forEach(item => {
        item.deleted = true;
        stampItem(item, timestamp);
      });

      persistItems();
      setUnsaved(true);
      render();
      showToast("Oznacene polozky vymazane.");
    }

    function parseSyncItems(data) {
      if (Array.isArray(data)) return normalizeItems(data);
      if (data && Array.isArray(data.items)) return normalizeItems(data.items);
      return [];
    }

    function fetchRemoteItems() {
      const attempts = [
        () => fetch(SHEETS_SYNC_URL + "?action=get", { method: "GET", cache: "no-store" }),
        () => fetch(SHEETS_SYNC_URL + "?action=load", { method: "GET", cache: "no-store" }),
        () => fetch(SHEETS_SYNC_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "get" })
        })
      ];

      let index = 0;
      let lastError = null;

      function runNext() {
        if (index >= attempts.length) {
          return Promise.reject(lastError || new Error("Sheets sync is unavailable."));
        }

        return attempts[index++]()
          .then(response => {
            if (!response.ok) {
              throw new Error("HTTP " + response.status);
            }

            return response.json().catch(() => {
              throw new Error("Invalid JSON response.");
            });
          })
          .then(data => {
            if (data && data.ok === false) {
              throw new Error(data.error || "Sheets sync error.");
            }

            if (Array.isArray(data) || (data && Array.isArray(data.items))) {
              return parseSyncItems(data);
            }

            throw new Error("Unexpected sync response.");
          })
          .catch(error => {
            lastError = error;
            return runNext();
          });
      }

      return runNext();
    }

    function loadFromSheets(showFeedback) {
      if (state.syncInProgress) return Promise.resolve(false);
      if (state.unsaved) {
        if (showFeedback) {
          showToast("Mas neulozene zmeny. Najprv uloz.");
        }
        updatePullIndicator(0, false);
        return Promise.resolve(false);
      }

      state.syncInProgress = true;
      setStatus("loading", "Nacitavam zo Sheets...");
      updatePullIndicator(PULL_THRESHOLD, true);

      return fetchRemoteItems()
        .then(remoteItems => {
          state.items = normalizeItems(remoteItems);
          persistItems();
          touchSyncSuccess();
          setUnsaved(false);
          render();
          setStatus("synced", "Aktualne");
          if (showFeedback) {
            showToast("Nacitane zo Sheets.");
          }
          return true;
        })
        .catch(error => {
          console.error(error);
          setStatus("error", "Nacitavanie zlyhalo");
          if (showFeedback) {
            showToast("Nacitavanie zlyhalo.");
          }
          return false;
        })
        .finally(() => {
          state.syncInProgress = false;
          updatePullIndicator(0, false);
          updateStatusFromState();
        });
    }

    function saveToSheets(showFeedback) {
      if (state.syncInProgress) return Promise.resolve(false);

      state.syncInProgress = true;
      setStatus("loading", "Ukladam do Sheets...");

      return fetchRemoteItems()
        .then(remoteItems => {
          const merged = normalizeItems([...(remoteItems || []), ...(state.items || [])]);

          return fetch(SHEETS_SYNC_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "sync", items: merged })
          })
            .then(response => {
              if (!response.ok) {
                throw new Error("HTTP " + response.status);
              }

              return response.json().catch(() => ({}));
            })
            .then(data => {
              if (data && data.ok === false) {
                throw new Error(data.error || "Sheets sync error.");
              }

              if (Array.isArray(data) || (data && Array.isArray(data.items))) {
                return parseSyncItems(data);
              }

              return merged;
            });
        })
        .then(finalItems => {
          state.items = normalizeItems(finalItems);
          persistItems();
          touchSyncSuccess();
          setUnsaved(false);
          render();
          setStatus("synced", "Ulozene");
          if (showFeedback) {
            showToast("Ulozene do Sheets.");
          }
          return true;
        })
        .catch(error => {
          console.error(error);
          setStatus("error", "Ukladanie zlyhalo");
          if (showFeedback) {
            showToast("Ulozenie zlyhalo.");
          }
          return false;
        })
        .finally(() => {
          state.syncInProgress = false;
          updateStatusFromState();
        });
    }

    function updatePullIndicator(distance, loading) {
      const indicator = document.getElementById("pull-indicator");
      if (!indicator) return;

      if (loading) {
        indicator.classList.add("active");
        indicator.textContent = "Nacitavam zo Sheets...";
        return;
      }

      if (!distance) {
        indicator.classList.remove("active");
        indicator.textContent = "Potiahni dole pre nacitanie";
        return;
      }

      indicator.classList.add("active");
      indicator.textContent = distance >= PULL_THRESHOLD ? "Pusti pre nacitanie" : "Potiahni dole pre nacitanie";
    }

    function bindPullToRefresh() {
      const list = document.getElementById("list");
      if (!list || list.dataset.pullBound === "1") return;

      list.dataset.pullBound = "1";

      list.addEventListener("touchstart", event => {
        if (state.syncInProgress || state.unsaved) return;
        if (list.scrollTop > 0) return;

        const touch = event.touches && event.touches[0];
        if (!touch) return;
        if (event.target.closest("button, input")) return;

        state.pull = {
          startY: touch.clientY,
          distance: 0
        };
      }, { passive: true });

      list.addEventListener("touchmove", event => {
        if (!state.pull) return;

        const touch = event.touches && event.touches[0];
        if (!touch) return;

        const delta = touch.clientY - state.pull.startY;
        if (delta <= 0 || list.scrollTop > 0) {
          state.pull = null;
          updatePullIndicator(0, false);
          return;
        }

        state.pull.distance = Math.min(120, delta * 0.7);
        updatePullIndicator(state.pull.distance, false);
        event.preventDefault();
      }, { passive: false });

      list.addEventListener("touchend", () => {
        if (!state.pull) return;

        const shouldLoad = state.pull.distance >= PULL_THRESHOLD;
        state.pull = null;

        if (shouldLoad) {
          loadFromSheets(true);
          return;
        }

        updatePullIndicator(0, false);
      }, { passive: true });

      list.addEventListener("touchcancel", () => {
        state.pull = null;
        updatePullIndicator(0, false);
      }, { passive: true });
    }

    function registerServiceWorker() {
      if (!("serviceWorker" in navigator)) return;

      let refreshing = false;

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      navigator.serviceWorker.register("./service-worker.js")
        .then(registration => registration.update())
        .catch(error => {
          console.error(error);
        });
    }

    function boot() {
      state.items = loadLocalItems();

      updateDeviceUi();
      render();
      updateStatusFromState();
      bindPullToRefresh();
      registerServiceWorker();

      document.getElementById("add-form").addEventListener("submit", event => {
        event.preventDefault();
        const input = document.getElementById("input-name");
        addItem(input.value);
        input.value = "";
        input.focus();
      });

      document.getElementById("btn-save").addEventListener("click", () => {
        saveToSheets(true);
      });

      document.getElementById("btn-load").addEventListener("click", () => {
        loadFromSheets(true);
      });

      document.getElementById("btn-mark-all").addEventListener("click", markAllBought);
      document.getElementById("btn-clear-checked").addEventListener("click", clearChecked);
      document.getElementById("btn-device").addEventListener("click", promptForDeviceName);
      if (!state.unsaved) {
        loadFromSheets(false);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  </script>
</body>
