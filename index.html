          const deleteSectionButton = document.createElement("button");
          deleteSectionButton.type = "button";
          deleteSectionButton.className = "item-delete";
          deleteSectionButton.textContent = "×";
          deleteSectionButton.addEventListener("click", () => {
            deletePackingSection(section.id);
          });

          sectionActions.appendChild(editSectionButton);
          sectionActions.appendChild(deleteSectionButton);
          head.appendChild(sectionActions);
        }

        const form = document.createElement("form");
        form.className = "vacation-inline-form";

        const input = document.createElement("input");
        input.className = "mini-input";
        input.type = "text";
        input.autocomplete = "off";
        input.placeholder = section.important ? "Čo nesmieme zabudnúť?" : "Čo treba zbaliť?";
        input.dataset.sectionId = section.id;
        input.value = state.drafts.packingItems && typeof state.drafts.packingItems[section.id] === "string"
          ? state.drafts.packingItems[section.id]
          : "";
        input.addEventListener("input", () => {
          setPackingItemDraft(section.id, input.value);
        });
        input.addEventListener("blur", () => {
          window.setTimeout(() => {
            flushDeferredForegroundRefresh();
          }, 120);
        });

        const addButton = document.createElement("button");
        addButton.type = "submit";
        addButton.className = "mini-add";
        addButton.textContent = "+";

        form.appendChild(input);
        form.appendChild(addButton);
        form.addEventListener("submit", event => {
          event.preventDefault();
          const added = addPackingItem(section.id, input.value);
          if (added) {
            flushDeferredForegroundRefresh();
          }
        });

        const itemsList = document.createElement("div");
        itemsList.className = "vacation-items";

        if (!sectionItems.length) {
          const emptyItems = document.createElement("div");
          emptyItems.className = "vacation-empty";
          emptyItems.style.minHeight = "0";
          emptyItems.style.padding = "14px";
          emptyItems.innerHTML = section.important
            ? "<div>Napríklad poistenie alebo diaľničná známka.</div>"
            : "<div>Sem si dopíšete, čo ešte treba zbaliť.</div>";
          itemsList.appendChild(emptyItems);
        } else {
          sectionItems.forEach(item => {
            const row = document.createElement("div");
            row.className = "vacation-item" + (item.packed ? " packed" : "");
            row.addEventListener("click", event => {
              if (event.target.closest("button")) return;
              togglePackingItem(item.id);
            });

            const check = document.createElement("div");
            check.className = "item-check";
            check.textContent = item.packed ? "OK" : "";

            const main = document.createElement("div");
            main.className = "item-main";

            const name = document.createElement("div");
            name.className = "vacation-item-name";
            name.textContent = item.name;
            main.appendChild(name);

            const sub = document.createElement("div");
            sub.className = "vacation-item-sub";

            const source = sourceText(item);
            if (source) {
              const sourceChip = document.createElement("div");
              sourceChip.className = "chip source";
              sourceChip.textContent = source;
              sub.appendChild(sourceChip);
            }

            if (item.packed && item.packedAt) {
              const packedChip = document.createElement("div");
              packedChip.className = "chip";
              packedChip.textContent = formatDate(item.packedAt);
              sub.appendChild(packedChip);
            }

            if (sub.children.length) {
              main.appendChild(sub);
            }

            const actions = document.createElement("div");
            actions.className = "item-actions";

            const del = document.createElement("button");
            del.type = "button";
            del.className = "item-delete";
            del.textContent = "×";
            del.addEventListener("click", event => {
              event.stopPropagation();
              deletePackingItem(item.id);
            });

            actions.appendChild(del);
            row.appendChild(check);
            row.appendChild(main);
            row.appendChild(actions);
            itemsList.appendChild(row);
          });
        }

        sectionCard.appendChild(head);
        sectionCard.appendChild(form);
        sectionCard.appendChild(itemsList);
        board.appendChild(sectionCard);
      });

      if (!sections.length) {
        const empty = document.createElement("div");
        empty.className = "vacation-empty";
        empty.innerHTML = [
          "<strong>Zatiaľ nemáte bežnú sekciu</strong>",
          "<div>Hore si pridaj napríklad Drogériu, Lieky alebo Elektroniku.</div>"
        ].join("");
        board.appendChild(empty);
      }

      restoreVacationFocusState(focusState);
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      if (!toast) return;

      toast.textContent = message;
      toast.classList.add("show");

      if (state.toastTimer) {
        clearTimeout(state.toastTimer);
      }

      state.toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1800);
    }

    function setStatus(mode, text) {
      [
        ["sync-status-pill", "sync-status-text"],
        ["notes-sync-status-pill", "notes-sync-status-text"],
        ["vacation-sync-status-pill", "vacation-sync-status-text"]
      ].forEach(([pillId, labelId]) => {
        const pill = document.getElementById(pillId);
        const label = document.getElementById(labelId);
        if (!pill || !label) return;

        pill.classList.remove("loading", "synced", "saving", "error");
        if (mode) {
          pill.classList.add(mode);
        }
        label.textContent = text;
      });
    }

    function touchSyncSuccess() {
      localStorage.setItem(SYNC_KEY, nowIso());
      state.lastForegroundSyncAt = Date.now();
    }

    function setUnsaved(flag) {
      state.unsaved = Boolean(flag);
      if (state.unsaved) {
        localStorage.setItem(UNSAVED_KEY, "1");
      } else {
        localStorage.removeItem(UNSAVED_KEY);
      }
      updateStatusFromState();
    }

    function updateStatusFromState() {
      if (state.syncInProgress) return;

      if (state.unsaved) {
        if (state.syncTimer) {
        setStatus("saving", "Ukladám...");
          return;
        }
        setStatus("error", "Čaká na uloženie");
        return;
      }

      if (localStorage.getItem(SYNC_KEY)) {
        setStatus("synced", "Aktuálne");
        return;
      }

      setStatus("", "Pripravené");
    }

    function updateDeviceUi() {
      const summary = document.getElementById("device-summary");
      const label = device.label || defaultDeviceLabel(device.type);
      const typeText = device.type === "mobile" ? "mobil" : "PC";

      if (summary) {
        summary.textContent = label + " (" + typeText + ")";
      }
    }

    function promptForDeviceName() {
      const suggested = device.label && device.label !== defaultDeviceLabel(device.type)
        ? device.label
        : (device.type === "mobile" ? "Domi" : "Peto");
      const raw = window.prompt("Názov zariadenia", suggested);
      if (raw === null) return;

      const next = raw.trim().slice(0, 24);
      if (!next) {
        showToast("Názov ostal bez zmeny.");
        return;
      }

      device.label = next;
      saveDevice();
      updateDeviceUi();
      closeMenu();
      showToast("Zariadenie nastavené.");
    }

    function cleanupItemDrag(drag) {
      if (!drag) return;

      if (drag.timer) {
        clearTimeout(drag.timer);
      }

      if (drag.ghost && drag.ghost.parentNode) {
        drag.ghost.parentNode.removeChild(drag.ghost);
      }

      if (drag.card) {
        drag.card.classList.remove("drag-origin");

        try {
          if (
            drag.inputKind === "pointer" &&
            typeof drag.card.hasPointerCapture === "function" &&
            drag.card.hasPointerCapture(drag.contactId)
          ) {
            drag.card.releasePointerCapture(drag.contactId);
          }
        } catch (error) {
          // The browser may release pointer capture before pointerup.
        }
      }

      document.body.classList.remove("item-reordering");
    }

    function cancelItemLongPress() {
      const drag = state.itemDrag;
      if (!drag) return;

      cleanupItemDrag(drag);
      state.itemDrag = null;
    }

    function activateItemDrag(drag) {
      if (
        state.itemDrag !== drag ||
        !drag.card ||
        !drag.card.isConnected
      ) {
        return;
      }

      const rect = drag.card.getBoundingClientRect();
      const ghost = drag.card.cloneNode(true);
      ghost.classList.add("item-drag-ghost");
      ghost.setAttribute("aria-hidden", "true");
      ghost.style.left = rect.left + "px";
      ghost.style.top = rect.top + "px";
      ghost.style.width = rect.width + "px";
      ghost.style.height = rect.height + "px";

      ghost.querySelectorAll("button").forEach(button => {
        button.tabIndex = -1;
      });

      drag.activated = true;
      drag.offsetY = drag.startY - rect.top;
      drag.ghost = ghost;
      drag.card.classList.add("drag-origin");
      document.body.classList.add("item-reordering");
      document.body.appendChild(ghost);

      if (drag.inputKind === "pointer") {
        try {
          drag.card.setPointerCapture(drag.contactId);
        } catch (error) {
          // Pointer capture is optional; document listeners remain active.
        }
      }

      markTyping();
      haptic(24);
      showToast("Potiahni položku hore alebo dole.");
    }

    function createItemLongPress(item, card, inputKind, contactId, clientX, clientY) {
      cancelItemLongPress();
      markTyping();

      const drag = {
        id: item.id,
        bought: item.bought === true,
        card: card,
        inputKind: inputKind,
        contactId: contactId,
        startX: clientX,
        startY: clientY,
        activated: false,
        moved: false,
        ghost: null,
        timer: null
      };

      drag.timer = setTimeout(() => {
        activateItemDrag(drag);
      }, 460);

      state.itemDrag = drag;
    }

    function beginItemPointerLongPress(event, item, card) {
      if (
        !event ||
        !item ||
        !card ||
        event.pointerType === "touch" ||
        event.target.closest("button") ||
        (event.pointerType === "mouse" && event.button !== 0)
      ) {
        return;
      }

      createItemLongPress(
        item,
        card,
        "pointer",
        event.pointerId,
        event.clientX,
        event.clientY
      );
    }

    function beginItemTouchLongPress(event, item, card) {
      if (
        !event ||
        !item ||
        !card ||
        event.touches.length !== 1 ||
        event.target.closest("button")
      ) {
        return;
      }

      const touch = event.touches[0];
      createItemLongPress(
        item,
        card,
        "touch",
        touch.identifier,
        touch.clientX,
        touch.clientY
      );
    }

    function findTouchById(touchList, identifier) {
      if (!touchList) return null;

      for (let index = 0; index < touchList.length; index += 1) {
        if (touchList[index].identifier === identifier) {
          return touchList[index];
        }
      }

      return null;
    }

    function moveActivatedItemDrag(drag, clientX, clientY) {
      markTyping();

      if (drag.ghost) {
        drag.ghost.style.top =
          Math.round(clientY - drag.offsetY) + "px";
      }

      const pointed = document.elementFromPoint(
        clientX,
        clientY
      );
      const target = pointed ? pointed.closest(".item") : null;

      if (
        !target ||
        target === drag.card ||
        target.classList.contains("item-drag-ghost") ||
        target.dataset.bought !== (drag.bought ? "1" : "0")
      ) {
        return;
      }

      const rect = target.getBoundingClientRect();
      const placeBefore = clientY < rect.top + rect.height / 2;

      if (placeBefore) {
        if (drag.card.nextSibling === target) return;
        target.parentNode.insertBefore(drag.card, target);
      } else {
        if (target.nextSibling === drag.card) return;
        target.parentNode.insertBefore(drag.card, target.nextSibling);
      }

      drag.moved = true;
    }

    function handleItemPointerMove(event) {
      const drag = state.itemDrag;
      if (
        !drag ||
        drag.inputKind !== "pointer" ||
        event.pointerId !== drag.contactId
      ) {
        return;
      }

      if (!drag.activated) {
        const distance = Math.hypot(
          event.clientX - drag.startX,
          event.clientY - drag.startY
        );

        if (distance > 10) {
          cancelItemLongPress();
        }
        return;
      }

      event.preventDefault();
      moveActivatedItemDrag(
        drag,
        event.clientX,
        event.clientY
      );
    }

    function handleItemTouchMove(event) {
      const drag = state.itemDrag;
      if (!drag || drag.inputKind !== "touch") return;

      const touch = findTouchById(
        event.touches,
        drag.contactId
      );
      if (!touch) return;

      if (!drag.activated) {
        const distance = Math.hypot(
          touch.clientX - drag.startX,
          touch.clientY - drag.startY
        );

        if (distance > 10) {
          cancelItemLongPress();
        }
        return;
      }

      event.preventDefault();
      moveActivatedItemDrag(
        drag,
        touch.clientX,
        touch.clientY
      );
    }

    function saveShoppingItemOrder(orderedIds) {
      const timestamp = nowIso();
      let changed = false;

      orderedIds.forEach((id, index) => {
        const item = state.items.find(entry => (
          entry &&
          entry.id === id &&
          !entry.deleted
        ));
        if (!item || Number(item.order) === index) return;

        item.order = index;
        stampItem(item, timestamp);
        changed = true;
      });

      if (!changed) {
        render();
        return;
      }

      touchLocalRevision();
      persistItems();
      render();
      scheduleAutoSave(320);
      haptic(18);
      showToast("Poradie uložené.");
    }

    function completeItemDrag() {
      const drag = state.itemDrag;
      if (!drag) return;

      if (!drag.activated) {
        cancelItemLongPress();
        return;
      }

      const list = document.getElementById("list");
      const orderedIds = list
        ? Array.from(
            list.querySelectorAll(
              '.item[data-bought="' +
              (drag.bought ? "1" : "0") +
              '"]'
            )
          ).map(card => card.dataset.id)
        : [];

      const moved = drag.moved;
      cleanupItemDrag(drag);
      state.itemDrag = null;
      state.suppressItemClickUntil = Date.now() + 500;

      if (moved && orderedIds.length) {
        saveShoppingItemOrder(orderedIds);
      }
    }

    function finishItemPointerDrag(event) {
      const drag = state.itemDrag;
      if (
        !drag ||
        drag.inputKind !== "pointer" ||
        event.pointerId !== drag.contactId
      ) {
        return;
      }

      if (drag.activated) {
        event.preventDefault();
      }
      completeItemDrag();
    }

    function finishItemTouchDrag(event) {
      const drag = state.itemDrag;
      if (!drag || drag.inputKind !== "touch") return;

      const touch = findTouchById(
        event.changedTouches,
        drag.contactId
      );
      if (!touch) return;

      if (drag.activated) {
        event.preventDefault();
      }
      completeItemDrag();
    }

    function renderGroup(container, title, className, items) {
      if (!items.length) return;

      const heading = document.createElement("div");
      heading.className = "group-title" + (className ? " " + className : "");
      heading.textContent = title;
      container.appendChild(heading);

      items.forEach(item => {
        container.appendChild(renderItem(item));
      });
    }

    function renderItem(item) {
      const card = document.createElement("div");
      card.className = "item" + (item.bought ? " bought" : "");
      card.dataset.id = item.id;
      card.dataset.bought = item.bought ? "1" : "0";

      card.addEventListener("click", event => {
        if (Date.now() < state.suppressItemClickUntil) return;
        if (event.target.closest("button")) return;
        toggleBought(item.id);
      });
      card.addEventListener("pointerdown", event => {
        beginItemPointerLongPress(event, item, card);
      });
      card.addEventListener("touchstart", event => {
        beginItemTouchLongPress(event, item, card);
      }, {
        passive: true
      });
      card.addEventListener("contextmenu", event => {
        event.preventDefault();
      });

      const check = document.createElement("div");
      check.className = "item-check";
      check.textContent = item.bought ? "OK" : "";

      const main = document.createElement("div");
      main.className = "item-main";

      const name = document.createElement("div");
      name.className = "item-name";
      name.textContent = item.name;
      main.appendChild(name);

      const meta = document.createElement("div");
      meta.className = "item-meta";

      const source = sourceText(item);
      if (source) {
        const sourceChip = document.createElement("div");
        sourceChip.className = "chip source";
        sourceChip.textContent = source;
        meta.appendChild(sourceChip);
      }

      if (item.bought && item.boughtAt) {
        const boughtChip = document.createElement("div");
        boughtChip.className = "chip";
        boughtChip.textContent = formatDate(item.boughtAt);
        meta.appendChild(boughtChip);
      }

      if (meta.children.length) {
        main.appendChild(meta);
      }

      const actions = document.createElement("div");
      actions.className = "item-actions";

      const del = document.createElement("button");
      del.type = "button";
      del.className = "item-delete";
      del.textContent = "×";
      del.addEventListener("click", event => {
        event.stopPropagation();
        deleteSingle(item.id);
      });

      actions.appendChild(del);
      card.appendChild(check);
      card.appendChild(main);
      card.appendChild(actions);
      return card;
    }

    function render() {
      const list = document.getElementById("list");
      if (!list) return;

      if (state.itemDrag && state.itemDrag.activated) {
        return;
      }
      if (state.itemDrag) {
        cancelItemLongPress();
      }

      list.innerHTML = "";
      const items = visibleItems();

      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML = [
          '<div class="empty-title">Zoznam je prázdny</div>',
          '<div>Pridaj prvú položku a ďalej to pôjde samo.</div>'
        ].join("");
        list.appendChild(empty);
        updateBulkActionState();
        if (state.notesOpen) {
          renderNotesPanel();
        }
        return;
      }

      const open = items.filter(item => !item.bought);
      const done = items.filter(item => item.bought);

      renderGroup(list, "Kúpiť", "", open);
      renderGroup(list, "Kúpené", "done", done);
      updateBulkActionState();
      if (state.notesOpen) {
        renderNotesPanel();
      }
    }

    function updateBulkActionState() {
      const markAllButton = document.getElementById("btn-mark-all");
      const clearCheckedButton = document.getElementById("btn-clear-checked");
      if (!markAllButton || !clearCheckedButton) return;

      const items = visibleItems();
      markAllButton.disabled = !items.some(item => !item.bought);
      clearCheckedButton.disabled = !items.some(item => item.bought);
    }

    function nextTopOrder() {
      const items = visibleItems();
      if (!items.length) return 0;
      return Math.min(...items.map(item => Number.isFinite(Number(item.order)) ? Number(item.order) : 0)) - 1;
    }

    function scheduleAutoSave(delay) {
      if (state.syncTimer) {
        clearTimeout(state.syncTimer);
      }

      setUnsaved(true);
      setStatus("saving", "Ukladám...");

      state.syncTimer = setTimeout(() => {
        state.syncTimer = null;
        flushAutoSave(false);
      }, typeof delay === "number" ? delay : AUTO_SAVE_DELAY);
    }

    function queueFollowupSync() {
      state.syncQueued = true;
    }

    function flushAutoSave(showFeedback) {
      if (!state.unsaved) {
        return Promise.resolve(true);
      }

      if (state.syncTimer) {
        clearTimeout(state.syncTimer);
        state.syncTimer = null;
      }

      if (state.syncInProgress) {
        queueFollowupSync();
        return Promise.resolve(false);
      }

      return saveToSheets(Boolean(showFeedback));
    }

    function addItem(name) {
      const clean = String(name || "").trim();
      if (!clean) {
        showToast("Napíš, čo treba kúpiť.");
        return false;
      }

      state.items.unshift(stampItem({
        id: uid(),
        name: clean,
        bought: false,
        boughtAt: null,
        deleted: false,
        order: nextTopOrder(),
        notes: []
      }));

      rememberItemName(clean);
      touchLocalRevision();
      persistItems();
      render();
      scheduleAutoSave();
      haptic(12);
      state.drafts.shoppingName = "";
      persistDrafts();
      return true;
    }

    function submitShoppingInput(options) {
      const input = document.getElementById("input-name");
      if (!input) return;

      const added = addItem(input.value);
      if (!added) return;

      input.value = "";
      hideShoppingSuggestions();
      if (options && options.keepFocus) {
        focusShoppingInput();
        return;
      }

      input.focus();
    }

    function toggleBought(id) {
      const item = state.items.find(entry => entry.id === id);
      if (!item || item.deleted) return;

      const timestamp = nowIso();
      item.bought = !item.bought;
      item.boughtAt = item.bought ? timestamp : null;
      stampItem(item, timestamp);
      touchLocalRevision();
      persistItems();
      render();
      scheduleAutoSave(500);
      haptic(item.bought ? 18 : 8);
    }

    function deleteSingle(id) {
      const item = state.items.find(entry => entry.id === id);
      if (!item || item.deleted) return;

      item.deleted = true;
      stampItem(item);
      touchLocalRevision();
      persistItems();
      if (state.noteItemId === id) {
        closeNotes();
      }
      render();
      scheduleAutoSave(500);
      showToast("Položka vymazaná.");
    }

    function markAllBought() {
      const items = state.items.filter(item => item && !item.deleted && !item.bought);
      if (!items.length) {
        showToast("Nie je čo označiť.");
        return;
      }

      const timestamp = nowIso();
      items.forEach(item => {
        item.bought = true;
        item.boughtAt = timestamp;
        stampItem(item, timestamp);
      });

      touchLocalRevision();
      persistItems();
      render();
      scheduleAutoSave(400);
      closeMenu();
      showToast("Všetko je označené.");
    }

    function clearChecked() {
      const items = state.items.filter(item => item && item.bought && !item.deleted);
      if (!items.length) {
        showToast("Nie je čo vymazať.");
        return;
      }

      const timestamp = nowIso();
      items.forEach(item => {
        item.deleted = true;
        stampItem(item, timestamp);
      });

      touchLocalRevision();
      persistItems();
      render();
      scheduleAutoSave(400);
      closeMenu();
      showToast("Označené položky vymazané.");
    }

    function parseSyncPayload(data) {
      if (Array.isArray(data)) {
        return {
          items: normalizeItems(data),
          packing: { sections: [], items: [] }
        };
      }

      return {
        items: data && Array.isArray(data.items) ? normalizeItems(data.items) : [],
        packing: data && data.packing ? normalizePacking(data.packing) : { sections: [], items: [] }
      };
    }

    function fetchRemoteData() {
      const attempts = [
        () => fetch(SHEETS_SYNC_URL + "?action=get", { method: "GET", cache: "no-store" }),
        () => fetch(SHEETS_SYNC_URL + "?action=load", { method: "GET", cache: "no-store" }),
        () => fetch(SHEETS_SYNC_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "get" })
        })
      ];

      let index = 0;
      let lastError = null;

      function runNext() {
        if (index >= attempts.length) {
          return Promise.reject(lastError || new Error("Sheets sync is unavailable."));
        }

        return attempts[index++]()
          .then(response => {
            if (!response.ok) {
              throw new Error("HTTP " + response.status);
            }

            return response.json().catch(() => {
              throw new Error("Invalid JSON response.");
            });
          })
          .then(data => {
            if (data && data.ok === false) {
              throw new Error(data.error || "Sheets sync error.");
            }

            if (Array.isArray(data) || (data && (Array.isArray(data.items) || data.packing))) {
              return parseSyncPayload(data);
            }

            throw new Error("Unexpected sync response.");
          })
          .catch(error => {
            lastError = error;
            return runNext();
          });
      }

      return runNext();
    }

    function loadFromSheets(showFeedback) {
      if (state.syncInProgress) return Promise.resolve(false);
      if (state.unsaved) {
        return flushAutoSave(showFeedback);
      }

      const requestRevision = state.localRevision;
      state.syncInProgress = true;
      setStatus("loading", "Načítavam...");

      return fetchRemoteData()
        .then(remoteSnapshot => {
          const changedDuringRequest = applyServerSnapshot(remoteSnapshot, requestRevision);
          touchSyncSuccess();
          render();
          renderVacation();

          if (changedDuringRequest) {
            setUnsaved(true);
            scheduleAutoSave(250);
            if (showFeedback) {
              showToast("Načítané, tvoje zmeny sa ešte ukladajú.");
            }
            return true;
          }

          setUnsaved(false);
          setStatus("synced", "Aktuálne");
          if (showFeedback) {
            showToast("Načítané zo Sheets.");
          }
          return true;
        })
        .catch(error => {
          console.error(error);
          setStatus("error", "Načítavanie zlyhalo");
          if (showFeedback) {
            showToast("Načítavanie zlyhalo.");
          }
          return false;
        })
        .finally(() => {
          state.syncInProgress = false;
          updatePullIndicator(0, false);
          updateStatusFromState();
        });
    }

    function saveToSheets(showFeedback) {
      if (state.syncInProgress) return Promise.resolve(false);

      const requestRevision = state.localRevision;
      const localSnapshot = {
        items: normalizeItems(state.items),
        packing: normalizePacking(state.packing)
      };
      state.syncInProgress = true;
      setStatus("loading", "Ukladám...");

      return fetchRemoteData()
        .then(remoteSnapshot => {
          const merged = {
            items: normalizeItems([
              ...(((remoteSnapshot && remoteSnapshot.items) || [])),
              ...((localSnapshot && localSnapshot.items) || [])
            ]),
            packing: mergePacking(
              remoteSnapshot && remoteSnapshot.packing,
              localSnapshot && localSnapshot.packing
            )
          };

          return fetch(SHEETS_SYNC_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              action: "sync",
              items: merged.items,
              packing: merged.packing
            })
          })
            .then(response => {
              if (!response.ok) {
                throw new Error("HTTP " + response.status);
              }

              return response.json().catch(() => ({}));
            })
            .then(data => {
              if (data && data.ok === false) {
                throw new Error(data.error || "Sheets sync error.");
              }

              if (Array.isArray(data) || (data && (Array.isArray(data.items) || data.packing))) {
                return parseSyncPayload(data);
              }

              return merged;
            });
        })
        .then(finalSnapshot => {
          const changedDuringRequest = applyServerSnapshot(finalSnapshot, requestRevision);
          touchSyncSuccess();
          render();
          renderVacation();

          if (changedDuringRequest) {
            setUnsaved(true);
            scheduleAutoSave(250);
            if (showFeedback) {
              showToast("Uložené, ďalšie zmeny sa ešte ukladajú.");
            }
            return true;
          }

          setUnsaved(false);
          setStatus("synced", "Aktuálne");
          if (showFeedback) {
            showToast("Uložené.");
          }
          return true;
        })
        .catch(error => {
          console.error(error);
          setStatus("error", "Ukladanie zlyhalo");
          if (showFeedback) {
            showToast("Uloženie zlyhalo.");
          }
          return false;
        })
        .finally(() => {
          state.syncInProgress = false;
          updateStatusFromState();
          if (state.syncQueued) {
            state.syncQueued = false;
            if (state.unsaved) {
              scheduleAutoSave(350);
            }
          }
        });
    }

    function refreshFromForeground(force) {
      if (force) {
        state.pendingForegroundRefresh = false;
      }

      const now = Date.now();
      if (!force && now - state.lastForegroundSyncAt < FOREGROUND_SYNC_GAP) {
        return Promise.resolve(false);
      }

      if (!force && isTypingProtected()) {
        queueForegroundRefresh();
        return Promise.resolve(false);
      }

      if (state.unsaved) {
        return flushAutoSave(false);
      }

      return loadFromSheets(false);
    }

    function updatePullIndicator(distance, loading) {
      const indicator = document.getElementById("pull-indicator");
      if (!indicator) return;

      if (loading) {
        indicator.classList.add("active");
        indicator.textContent = "Načítavam...";
        return;
      }

      if (!distance) {
        indicator.classList.remove("active");
        indicator.textContent = "Pusti pre obnovenie";
        return;
      }

      indicator.classList.add("active");
      indicator.textContent = distance >= PULL_THRESHOLD ? "Pusti pre obnovenie" : "Potiahni ešte trochu";
    }

    function bindPullToRefresh() {
      document.addEventListener("touchstart", event => {
        if (state.syncInProgress) return;
        if (window.scrollY > 0) return;
        if (event.target.closest("button, input, .menu-sheet")) return;

        const touch = event.touches && event.touches[0];
        if (!touch) return;

        state.pull = {
          startY: touch.clientY,
          distance: 0
        };
      }, { passive: true });

      document.addEventListener("touchmove", event => {
        if (!state.pull) return;

        const touch = event.touches && event.touches[0];
        if (!touch) return;

        const delta = touch.clientY - state.pull.startY;
        if (delta <= 0 || window.scrollY > 0) {
          state.pull = null;
          updatePullIndicator(0, false);
          return;
        }

        state.pull.distance = Math.min(120, delta * 0.7);
        updatePullIndicator(state.pull.distance, false);
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("touchend", () => {
        if (!state.pull) return;

        const shouldRefresh = state.pull.distance >= PULL_THRESHOLD;
        state.pull = null;

        if (shouldRefresh) {
          updatePullIndicator(PULL_THRESHOLD, true);
          refreshFromForeground(true);
          return;
        }

        updatePullIndicator(0, false);
      }, { passive: true });

      document.addEventListener("touchcancel", () => {
        state.pull = null;
        updatePullIndicator(0, false);
      }, { passive: true });
    }

    function openMenu() {
      if (state.notesOpen) {
        closeNotes();
      }
      if (state.vacationOpen) {
        closeVacation();
      }

      const backdrop = document.getElementById("menu-backdrop");
      const sheet = document.getElementById("menu-sheet");
      if (!backdrop || !sheet) return;

      state.menuOpen = true;
      backdrop.hidden = false;
      requestAnimationFrame(() => {
        backdrop.classList.add("open");
        sheet.classList.add("open");
        sheet.setAttribute("aria-hidden", "false");
      });
    }

    function closeMenu() {
      const backdrop = document.getElementById("menu-backdrop");
      const sheet = document.getElementById("menu-sheet");
      if (!backdrop || !sheet) return;

      state.menuOpen = false;
      backdrop.classList.remove("open");
      sheet.classList.remove("open");
      sheet.setAttribute("aria-hidden", "true");
      setTimeout(() => {
        if (!state.menuOpen) {
          backdrop.hidden = true;
        }
      }, 220);
    }

    function openVacation() {
      if (state.menuOpen) {
        closeMenu();
      }
      if (state.notesOpen) {
        closeNotes();
      }

      const backdrop = document.getElementById("vacation-backdrop");
      const modal = document.getElementById("vacation-modal");
      if (!backdrop || !modal) return;

      state.vacationOpen = true;
      renderVacation();
      backdrop.hidden = false;
      requestAnimationFrame(() => {
        backdrop.classList.add("open");
        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
      });
    }

    function closeVacation() {
      const backdrop = document.getElementById("vacation-backdrop");
      const modal = document.getElementById("vacation-modal");
      if (!backdrop || !modal) return;

      state.vacationOpen = false;
      backdrop.classList.remove("open");
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      setTimeout(() => {
        if (!state.vacationOpen) {
          backdrop.hidden = true;
        }
      }, 220);
    }

    function registerServiceWorker() {
      if (!("serviceWorker" in navigator)) return;

      let refreshing = false;

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      navigator.serviceWorker.register("./service-worker.js")
        .then(registration => registration.update())
        .catch(error => {
          console.error(error);
        });
    }

    function bindEvents() {
      const shoppingInput = document.getElementById("input-name");
      const notesInput = document.getElementById("notes-input");
      const vacationSectionInput = document.getElementById("vacation-section-name");

      if (shoppingInput) {
        shoppingInput.value = state.drafts.shoppingName || "";
        shoppingInput.addEventListener("input", () => {
          setDraftValue("shoppingName", shoppingInput.value);
          renderShoppingSuggestions();
        });
        shoppingInput.addEventListener("focus", () => {
          renderShoppingSuggestions();
        });
        shoppingInput.addEventListener("keydown", event => {
          if (!state.quickAdd || event.key !== "Enter" || event.isComposing) {
            return;
          }

          event.preventDefault();
          submitShoppingInput({ keepFocus: true });
        });
        shoppingInput.addEventListener("blur", () => {
          window.setTimeout(() => {
            hideShoppingSuggestions();
            flushDeferredForegroundRefresh();
          }, 120);
        });
      }

      document.addEventListener("pointermove", handleItemPointerMove, {
        passive: false
      });
      document.addEventListener("pointerup", finishItemPointerDrag, {
        passive: false
      });
      document.addEventListener("pointercancel", finishItemPointerDrag, {
        passive: false
      });
      document.addEventListener("touchmove", handleItemTouchMove, {
        passive: false
      });
      document.addEventListener("touchend", finishItemTouchDrag, {
        passive: false
      });
      document.addEventListener("touchcancel", finishItemTouchDrag, {
        passive: false
      });

      if (vacationSectionInput) {
        vacationSectionInput.value = state.drafts.vacationSectionName || "";
        vacationSectionInput.addEventListener("input", () => {
          setDraftValue("vacationSectionName", vacationSectionInput.value);
        });
        vacationSectionInput.addEventListener("blur", () => {
          window.setTimeout(() => {
            flushDeferredForegroundRefresh();
          }, 120);
        });
      }

      if (notesInput) {
        notesInput.addEventListener("input", () => {
          if (!state.noteItemId) return;
          setItemNoteDraft(state.noteItemId, notesInput.value);
        });
        notesInput.addEventListener("blur", () => {
          window.setTimeout(() => {
            flushDeferredForegroundRefresh();
          }, 120);
        });
      }

      updateQuickAddUi();

      document.getElementById("btn-quick-add").addEventListener("click", toggleQuickAdd);
      document.getElementById("add-form").addEventListener("submit", event => {
        event.preventDefault();
        submitShoppingInput({ keepFocus: state.quickAdd });
      });

      document.getElementById("btn-vacation").addEventListener("click", openVacation);
      document.getElementById("btn-menu").addEventListener("click", openMenu);
      document.getElementById("btn-close-menu").addEventListener("click", closeMenu);
      document.getElementById("btn-close-notes").addEventListener("click", closeNotes);
      document.getElementById("menu-backdrop").addEventListener("click", closeMenu);
      document.getElementById("notes-backdrop").addEventListener("click", closeNotes);
      document.getElementById("btn-close-vacation").addEventListener("click", closeVacation);
      document.getElementById("vacation-backdrop").addEventListener("click", closeVacation);
      document.getElementById("btn-device").addEventListener("click", promptForDeviceName);
      document.getElementById("btn-refresh").addEventListener("click", () => {
        closeMenu();
        refreshFromForeground(true).then(result => {
          if (result) {
            showToast("Obnovené.");
          }
        });
      });
      document.getElementById("btn-sync-now").addEventListener("click", () => {
        closeMenu();
        flushAutoSave(true);
      });
      document.getElementById("btn-mark-all").addEventListener("click", markAllBought);
      document.getElementById("btn-clear-checked").addEventListener("click", clearChecked);
      document.getElementById("btn-clear-vacation").addEventListener("click", clearVacationBoard);
      document.getElementById("notes-form").addEventListener("submit", event => {
        event.preventDefault();
        if (!state.noteItemId) return;

        const input = document.getElementById("notes-input");
        const added = addItemNote(state.noteItemId, input ? input.value : "");
        if (added && input) {
          input.value = "";
        }
      });
      document.getElementById("vacation-section-form").addEventListener("submit", event => {
        event.preventDefault();
        const input = document.getElementById("vacation-section-name");
        const added = addPackingSection(input.value);
        if (added) {
          input.value = "";
          input.focus();
        }
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          if (state.notesOpen) {
            closeNotes();
            return;
          }
          if (state.menuOpen) {
            closeMenu();
            return;
          }
          if (state.vacationOpen) {
            closeVacation();
          }
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          refreshFromForeground(false);
        } else {
          markTyping();
        }
      });

      window.addEventListener("focus", () => {
        refreshFromForeground(false);
      });

      window.addEventListener("online", () => {
        refreshFromForeground(true);
      });
    }

    function boot() {
      state.items = loadLocalItems();
      state.packing = loadLocalPacking();
      seedItemHistory(state.items);

      updateDeviceUi();
      render();
      renderVacation();
      updateStatusFromState();
      bindEvents();
      bindPullToRefresh();
      registerServiceWorker();

      if (state.unsaved) {
        scheduleAutoSave(600);
      } else {
        loadFromSheets(false);
      }

      flushDeferredForegroundRefresh();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  </script>
