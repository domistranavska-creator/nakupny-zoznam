<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <title>Nakupny zoznam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #f472b6;
      --bg-2: #38bdf8;
      --bg-3: #1d4ed8;
      --panel: rgba(255, 255, 255, 0.94);
      --panel-strong: rgba(255, 255, 255, 0.98);
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(148, 163, 184, 0.2);
      --accent: #0ea5e9;
      --accent-strong: #0284c7;
      --success: #16a34a;
      --danger: #ef4444;
      --shadow: 0 22px 48px rgba(15, 23, 42, 0.18);
      --chip: rgba(241, 245, 249, 0.95);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }

    body {
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(244, 114, 182, 0.86), transparent 36%),
        radial-gradient(circle at top right, rgba(56, 189, 248, 0.9), transparent 34%),
        linear-gradient(140deg, #0f172a, #1e1b4b 44%, #164e63);
      padding: 16px 12px 26px;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .shell {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 250, 252, 0.92));
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 30px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 8px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .title-wrap {
      min-width: 0;
    }

    .title {
      margin: 0;
      font-family: "Baloo 2", system-ui, sans-serif;
      font-size: 1.95rem;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .status-row {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-pill {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .status-pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #94a3b8;
      box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.14);
    }

    .status-pill.loading::before {
      background: #f59e0b;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.18);
    }

    .status-pill.synced::before {
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.18);
    }

    .status-pill.saving::before {
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.18);
    }

    .status-pill.error::before {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.18);
    }

    .btn,
    .icon-btn,
    .item-delete {
      appearance: none;
      border: none;
      cursor: pointer;
      font: inherit;
    }

    .icon-btn {
      min-width: 44px;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.07);
      color: var(--text);
      font-weight: 800;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .icon-btn.primary {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.18), rgba(2, 132, 199, 0.24));
      color: #075985;
      border: 1px solid rgba(14, 165, 233, 0.18);
      box-shadow: 0 10px 22px rgba(14, 165, 233, 0.12);
    }

    .icon-btn:active,
    .btn:active,
    .item-delete:active {
      transform: translateY(1px) scale(0.98);
    }

    .composer {
      padding: 8px 18px 14px;
    }

    .composer-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .input-wrap {
      position: relative;
    }

    .input {
      width: 100%;
      min-width: 0;
      border: 1px solid rgba(203, 213, 225, 0.78);
      border-radius: 20px;
      padding: 16px 18px;
      font: inherit;
      font-size: 1.05rem;
      background: rgba(255, 255, 255, 0.96);
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .input:focus {
      outline: 2px solid rgba(14, 165, 233, 0.16);
      border-color: rgba(14, 165, 233, 0.65);
    }

    .btn-add {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #fff;
      font-size: 1.7rem;
      font-weight: 800;
      box-shadow: 0 14px 28px rgba(14, 165, 233, 0.22);
    }

    .list-wrapper {
      padding: 0 18px 18px;
    }

    .bottom-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding: 0 18px 18px;
    }

    .bottom-button {
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 16px;
      background: rgba(248, 250, 252, 0.94);
      color: var(--text);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .bottom-button.danger {
      color: #b91c1c;
      background: rgba(254, 242, 242, 0.98);
    }

    .bottom-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .pull-indicator {
      height: 0;
      opacity: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.8rem;
      transition: height 0.18s ease, opacity 0.18s ease;
    }

    .pull-indicator.active {
      height: 34px;
      opacity: 1;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 280px;
      scrollbar-width: none;
    }

    .list::-webkit-scrollbar {
      display: none;
    }

    .group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 4px 2px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .group-title::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12);
    }

    .group-title.done::before {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
    }

    .item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px 14px 14px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(226, 232, 240, 0.86);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.07);
      cursor: pointer;
    }

    .item.bought {
      background: linear-gradient(135deg, rgba(236, 253, 245, 0.98), rgba(220, 252, 231, 0.98));
      border-color: rgba(134, 239, 172, 0.92);
    }

    .item-check {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      border: 2px solid rgba(148, 163, 184, 0.86);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.95);
      color: transparent;
      font-weight: 900;
      flex-shrink: 0;
    }

    .item.bought .item-check {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-color: var(--success);
      color: #fff;
    }

    .item-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-name {
      font-size: 1.12rem;
      font-weight: 800;
      word-break: break-word;
    }

    .item.bought .item-name {
      color: #166534;
      text-decoration: line-through;
    }

    .item-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 9px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 800;
    }

    .chip.source {
      background: rgba(224, 242, 254, 0.96);
      color: #075985;
    }

    .item-delete {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      background: rgba(254, 226, 226, 0.86);
      color: #b91c1c;
      font-size: 0.9rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    .empty {
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
      padding: 22px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.56);
      border: 1px dashed rgba(148, 163, 184, 0.35);
      border-radius: 24px;
    }

    .empty-title {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--text);
    }

    .menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.36);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 40;
    }

    .menu-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .menu-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: min(560px, calc(100vw - 20px));
      margin: 0 auto 10px;
      padding: 16px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 26px 56px rgba(15, 23, 42, 0.26);
      transform: translateY(110%);
      transition: transform 0.24s ease;
      z-index: 45;
    }

    .menu-sheet.open {
      transform: translateY(0);
    }

    .vacation-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.46);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 55;
    }

    .vacation-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .vacation-modal {
      position: fixed;
      inset: 12px;
      width: min(680px, calc(100vw - 24px));
      max-height: calc(100dvh - 24px);
      margin: auto;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 250, 252, 0.96));
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 28px 64px rgba(15, 23, 42, 0.28);
      transform: translateY(24px) scale(0.98);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.24s ease, opacity 0.24s ease;
      z-index: 60;
      overflow: hidden;
    }

    .vacation-modal.open {
      transform: translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .vacation-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 12px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.9);
      background: rgba(255, 255, 255, 0.76);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .vacation-title {
      margin: 0;
      font-family: "Baloo 2", system-ui, sans-serif;
      font-size: 1.6rem;
      line-height: 1;
    }

    .vacation-subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .vacation-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px 18px;
      scrollbar-width: none;
    }

    .vacation-body::-webkit-scrollbar {
      display: none;
    }

    .vacation-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      margin-bottom: 14px;
    }

    .vacation-board {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .vacation-empty {
      padding: 24px 18px;
      border-radius: 22px;
      border: 1px dashed rgba(148, 163, 184, 0.34);
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      text-align: center;
    }

    .vacation-section {
      padding: 14px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(226, 232, 240, 0.88);
      box-shadow: 0 12px 26px rgba(15, 23, 42, 0.08);
    }

    .vacation-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .vacation-section-title {
      appearance: none;
      border: none;
      background: transparent;
      padding: 0;
      color: var(--text);
      font: inherit;
      font-size: 1.05rem;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
    }

    .vacation-section-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
    }

    .vacation-inline-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-bottom: 10px;
    }

    .mini-input {
      width: 100%;
      min-width: 0;
      border: 1px solid rgba(203, 213, 225, 0.78);
      border-radius: 16px;
      padding: 12px 14px;
      font: inherit;
      font-size: 0.96rem;
      background: rgba(255, 255, 255, 0.96);
      color: var(--text);
    }

    .mini-input:focus {
      outline: 2px solid rgba(14, 165, 233, 0.16);
      border-color: rgba(14, 165, 233, 0.65);
    }

    .mini-add {
      min-width: 48px;
      min-height: 48px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #fff;
      font: inherit;
      font-size: 1.4rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(14, 165, 233, 0.18);
    }

    .vacation-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .vacation-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 12px 12px 12px 10px;
      border-radius: 18px;
      background: rgba(248, 250, 252, 0.92);
      border: 1px solid rgba(226, 232, 240, 0.86);
      cursor: pointer;
    }

    .vacation-item.packed {
      background: linear-gradient(135deg, rgba(236, 253, 245, 0.98), rgba(220, 252, 231, 0.98));
      border-color: rgba(134, 239, 172, 0.9);
    }

    .vacation-item.packed .item-check {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-color: var(--success);
      color: #fff;
    }

    .vacation-item-name {
      font-size: 1rem;
      font-weight: 800;
      word-break: break-word;
    }

    .vacation-item.packed .vacation-item-name {
      text-decoration: line-through;
      color: #166534;
    }

    .vacation-item-sub {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .vacation-footer {
      padding-top: 14px;
    }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .sheet-title {
      font-family: "Baloo 2", system-ui, sans-serif;
      font-size: 1.35rem;
      line-height: 1;
    }

    .sheet-subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .sheet-close {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.08);
      color: var(--text);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .sheet-actions {
      display: grid;
      gap: 10px;
    }

    .sheet-button {
      min-height: 48px;
      padding: 0 16px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 16px;
      background: rgba(248, 250, 252, 0.95);
      color: var(--text);
      font: inherit;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
    }

    .sheet-button.danger {
      color: #b91c1c;
      background: rgba(254, 242, 242, 0.98);
    }

    .sheet-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(120%);
      opacity: 0;
      background: rgba(15, 23, 42, 0.96);
      color: #fff;
      padding: 11px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.28);
      transition: transform 0.2s ease, opacity 0.2s ease;
      z-index: 50;
      max-width: calc(100vw - 28px);
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 520px) {
      body {
        padding: 10px 10px 20px;
      }

      .topbar {
        padding: 16px 16px 8px;
      }

      .composer,
      .list-wrapper,
      .bottom-actions {
        padding-left: 16px;
        padding-right: 16px;
      }

      .title {
        font-size: 1.78rem;
      }

      .composer-form {
        gap: 8px;
      }

      .input {
        padding: 15px 16px;
      }

      .btn-add {
        width: 52px;
        height: 52px;
        border-radius: 16px;
      }

      .bottom-actions {
        grid-template-columns: 1fr;
      }

      .top-actions {
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .vacation-modal {
        inset: 8px;
        width: calc(100vw - 16px);
        max-height: calc(100dvh - 16px);
      }

      .vacation-head,
      .vacation-body {
        padding-left: 14px;
        padding-right: 14px;
      }

      .vacation-toolbar,
      .vacation-inline-form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="shell">
      <header class="topbar">
        <div class="title-wrap">
          <h1 class="title">Nakupny zoznam</h1>
          <div class="status-row">
            <div class="status-pill" id="sync-status-pill">
              <span id="sync-status-text">Pripravene</span>
            </div>
          </div>
        </div>
        <div class="top-actions">
          <button type="button" class="icon-btn primary" id="btn-vacation">Balime</button>
          <button type="button" class="icon-btn" id="btn-menu">Viac</button>
        </div>
      </header>

      <section class="composer">
        <form id="add-form" class="composer-form">
          <div class="input-wrap">
            <input class="input" id="input-name" type="text" autocomplete="off" placeholder="Co treba kupit?" />
          </div>
          <button type="submit" class="btn btn-add" aria-label="Pridat">+</button>
        </form>
      </section>

      <section class="list-wrapper">
        <div class="pull-indicator" id="pull-indicator">Pusti pre obnovenie</div>
        <div class="list" id="list"></div>
      </section>

      <section class="bottom-actions">
        <button type="button" class="bottom-button" id="btn-mark-all">Oznacit vsetko</button>
        <button type="button" class="bottom-button danger" id="btn-clear-checked">Vymazat odskrtnute</button>
      </section>
    </div>
  </div>

  <div class="menu-backdrop" id="menu-backdrop" hidden></div>

  <aside class="menu-sheet" id="menu-sheet" aria-hidden="true">
    <div class="sheet-head">
      <div>
        <div class="sheet-title">Viac</div>
        <div class="sheet-subtitle" id="device-summary">Zariadenie nie je nastavene</div>
      </div>
      <button type="button" class="sheet-close" id="btn-close-menu">X</button>
    </div>
    <div class="sheet-actions">
      <button type="button" class="sheet-button" id="btn-device">Premenovat zariadenie</button>
      <button type="button" class="sheet-button" id="btn-refresh">Nacitat zo Sheets</button>
      <button type="button" class="sheet-button" id="btn-sync-now">Ulozit teraz</button>
    </div>
  </aside>

  <div class="vacation-backdrop" id="vacation-backdrop" hidden></div>

  <aside class="vacation-modal" id="vacation-modal" aria-hidden="true">
    <header class="vacation-head">
      <div>
        <h2 class="vacation-title">Balime dovolenku</h2>
        <div class="vacation-subtitle">Vlastne sekcie, zdielane polozky a odfajkovanie ked je to zbalene.</div>
      </div>
      <button type="button" class="sheet-close" id="btn-close-vacation">X</button>
    </header>

    <div class="vacation-body">
      <form class="vacation-toolbar" id="vacation-section-form">
        <input class="input" id="vacation-section-name" type="text" autocomplete="off" placeholder="Nova sekcia napr. Drogeria" />
        <button type="submit" class="btn btn-add" aria-label="Pridat sekciu">+</button>
      </form>

      <div class="vacation-board" id="vacation-board"></div>

      <div class="vacation-footer">
        <button type="button" class="sheet-button danger" id="btn-clear-vacation">Vymazat celu dovolenku</button>
      </div>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "nakupnyZoznam_neonMEGA_items";
    const PACKING_KEY = "nakupnyZoznam_neonMEGA_packing_v1";
    const SYNC_KEY = "nakupnyZoznam_neonMEGA_sync_ts";
    const DEVICE_KEY = "nakupny_zoznam_device_v2";
    const UNSAVED_KEY = "nakupny_zoznam_unsaved_v2";
    const SHEETS_SYNC_URL = "https://script.google.com/macros/s/AKfycbw260UlklkZ4KEtiTvfHtvRr_z3R1Te5Ne3Foch9e38nBuWaeo1Y9eRY7dLKqONmyquFg/exec";
    const AUTO_SAVE_DELAY = 900;
    const PULL_THRESHOLD = 88;
    const FOREGROUND_SYNC_GAP = 8000;
    const NAME_LIMIT = 60;

    const state = {
      items: [],
      packing: { sections: [], items: [] },
      syncInProgress: false,
      unsaved: localStorage.getItem(UNSAVED_KEY) === "1",
      localRevision: 0,
      toastTimer: null,
      syncTimer: null,
      syncQueued: false,
      pull: null,
      menuOpen: false,
      vacationOpen: false,
      lastForegroundSyncAt: 0
    };

    const device = loadDevice();

    function uid() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }

      return "id-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function nowIso() {
      return new Date().toISOString();
    }

    function detectDeviceType() {
      const ua = (navigator.userAgent || "").toLowerCase();
      return /android|iphone|ipad|ipod|mobile/i.test(ua) ? "mobile" : "desktop";
    }

    function defaultDeviceLabel(type) {
      return type === "mobile" ? "Mobil" : "PC";
    }

    function loadDevice() {
      const fallbackType = detectDeviceType();

      try {
        const raw = localStorage.getItem(DEVICE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        const loaded = {
          id: parsed && parsed.id ? String(parsed.id) : uid(),
          type: parsed && parsed.type ? String(parsed.type) : fallbackType,
          label: parsed && parsed.label ? String(parsed.label) : defaultDeviceLabel(fallbackType)
        };
        localStorage.setItem(DEVICE_KEY, JSON.stringify(loaded));
        return loaded;
      } catch (error) {
        const loaded = {
          id: uid(),
          type: fallbackType,
          label: defaultDeviceLabel(fallbackType)
        };
        localStorage.setItem(DEVICE_KEY, JSON.stringify(loaded));
        return loaded;
      }
    }

    function saveDevice() {
      localStorage.setItem(DEVICE_KEY, JSON.stringify(device));
    }

    function loadLocalItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return normalizeItems(parsed);
      } catch (error) {
        return [];
      }
    }

    function loadLocalPacking() {
      try {
        const raw = localStorage.getItem(PACKING_KEY);
        const parsed = raw ? JSON.parse(raw) : { sections: [], items: [] };
        return normalizePacking(parsed);
      } catch (error) {
        return { sections: [], items: [] };
      }
    }

    function normalizeItems(items) {
      if (!Array.isArray(items)) return [];

      const merged = new Map();

      items
        .filter(item => item && typeof item.name === "string" && item.name.trim())
        .forEach((item, index) => {
          const normalized = {
            id: item.id ? String(item.id) : uid(),
            name: String(item.name || "").trim(),
            bought: Boolean(item.bought),
            boughtAt: item.boughtAt ? String(item.boughtAt) : null,
            updatedAt: item.updatedAt ? String(item.updatedAt) : (item.boughtAt ? String(item.boughtAt) : "1970-01-01T00:00:00.000Z"),
            order: Number.isFinite(Number(item.order)) ? Number(item.order) : index,
            deleted: item.deleted === true,
            updatedById: item.updatedById ? String(item.updatedById) : "",
            updatedByType: item.updatedByType === "mobile" ? "mobile" : (item.updatedByType === "desktop" ? "desktop" : ""),
            updatedByLabel: item.updatedByLabel ? String(item.updatedByLabel) : ""
          };

          const current = merged.get(normalized.id);
          if (!current) {
            merged.set(normalized.id, normalized);
            return;
          }

          const currentTime = current.updatedAt ? new Date(current.updatedAt).getTime() : 0;
          const nextTime = normalized.updatedAt ? new Date(normalized.updatedAt).getTime() : 0;
          if (nextTime >= currentTime) {
            merged.set(normalized.id, normalized);
          }
        });

      return Array.from(merged.values()).sort((a, b) => {
        if (a.order !== b.order) {
          return a.order - b.order;
        }

        const aTime = a.updatedAt ? new Date(a.updatedAt).getTime() : 0;
        const bTime = b.updatedAt ? new Date(b.updatedAt).getTime() : 0;
        return bTime - aTime;
      });
    }

    function normalizePacking(packing) {
      const sourceSections = packing && Array.isArray(packing.sections) ? packing.sections : [];
      const sourceItems = packing && Array.isArray(packing.items) ? packing.items : [];

      const mergedSections = new Map();
      sourceSections
        .filter(section => section && typeof section.name === "string" && section.name.trim())
        .forEach((section, index) => {
          const normalized = {
            id: section.id ? String(section.id) : uid(),
            name: String(section.name || "").trim().slice(0, NAME_LIMIT),
            order: Number.isFinite(Number(section.order)) ? Number(section.order) : index,
            deleted: section.deleted === true,
            updatedAt: section.updatedAt ? String(section.updatedAt) : "1970-01-01T00:00:00.000Z",
            updatedById: section.updatedById ? String(section.updatedById) : "",
            updatedByType: section.updatedByType === "mobile" ? "mobile" : (section.updatedByType === "desktop" ? "desktop" : ""),
            updatedByLabel: section.updatedByLabel ? String(section.updatedByLabel) : ""
          };

          const current = mergedSections.get(normalized.id);
          if (!current) {
            mergedSections.set(normalized.id, normalized);
            return;
          }

          const currentTime = current.updatedAt ? new Date(current.updatedAt).getTime() : 0;
          const nextTime = normalized.updatedAt ? new Date(normalized.updatedAt).getTime() : 0;
          if (nextTime >= currentTime) {
            mergedSections.set(normalized.id, normalized);
          }
        });

      const sections = Array.from(mergedSections.values()).sort((a, b) => {
        if (a.order !== b.order) {
          return a.order - b.order;
        }

        const aTime = a.updatedAt ? new Date(a.updatedAt).getTime() : 0;
        const bTime = b.updatedAt ? new Date(b.updatedAt).getTime() : 0;
        return bTime - aTime;
      });

      const visibleSectionIds = new Set(sections.map(section => section.id));
      const mergedItems = new Map();

      sourceItems
        .filter(item => item && typeof item.name === "string" && item.name.trim())
        .forEach((item, index) => {
          const normalized = {
            id: item.id ? String(item.id) : uid(),
            sectionId: item.sectionId ? String(item.sectionId) : "",
            name: String(item.name || "").trim().slice(0, NAME_LIMIT),
            packed: Boolean(item.packed),
            packedAt: item.packedAt ? String(item.packedAt) : null,
            order: Number.isFinite(Number(item.order)) ? Number(item.order) : index,
            deleted: item.deleted === true,
            updatedAt: item.updatedAt ? String(item.updatedAt) : (item.packedAt ? String(item.packedAt) : "1970-01-01T00:00:00.000Z"),
            updatedById: item.updatedById ? String(item.updatedById) : "",
            updatedByType: item.updatedByType === "mobile" ? "mobile" : (item.updatedByType === "desktop" ? "desktop" : ""),
            updatedByLabel: item.updatedByLabel ? String(item.updatedByLabel) : ""
          };

          if (!normalized.sectionId) {
            return;
          }

          const current = mergedItems.get(normalized.id);
          if (!current) {
            mergedItems.set(normalized.id, normalized);
            return;
          }

          const currentTime = current.updatedAt ? new Date(current.updatedAt).getTime() : 0;
          const nextTime = normalized.updatedAt ? new Date(normalized.updatedAt).getTime() : 0;
          if (nextTime >= currentTime) {
            mergedItems.set(normalized.id, normalized);
          }
        });

      const items = Array.from(mergedItems.values())
        .filter(item => item.deleted || visibleSectionIds.has(item.sectionId))
        .sort((a, b) => {
          if (a.order !== b.order) {
            return a.order - b.order;
          }

          const aTime = a.updatedAt ? new Date(a.updatedAt).getTime() : 0;
          const bTime = b.updatedAt ? new Date(b.updatedAt).getTime() : 0;
          return bTime - aTime;
        });

      return { sections, items };
    }

    function visibleItems() {
      return normalizeItems(state.items).filter(item => !item.deleted);
    }

    function persistItems() {
      state.items = normalizeItems(state.items);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items));
    }

    function persistPacking() {
      state.packing = normalizePacking(state.packing);
      localStorage.setItem(PACKING_KEY, JSON.stringify(state.packing));
    }

    function mergePacking(serverPacking, localPacking) {
      return normalizePacking({
        sections: [
          ...((serverPacking && serverPacking.sections) || []),
          ...((localPacking && localPacking.sections) || [])
        ],
        items: [
          ...((serverPacking && serverPacking.items) || []),
          ...((localPacking && localPacking.items) || [])
        ]
      });
    }

    function touchLocalRevision() {
      state.localRevision += 1;
      return state.localRevision;
    }

    function applyServerSnapshot(serverSnapshot, requestRevision) {
      const changedDuringRequest = state.localRevision !== requestRevision;
      const normalizedServerItems = normalizeItems(serverSnapshot && serverSnapshot.items);
      const normalizedServerPacking = normalizePacking(serverSnapshot && serverSnapshot.packing);

      state.items = changedDuringRequest
        ? normalizeItems([...(normalizedServerItems || []), ...(state.items || [])])
        : normalizedServerItems;
      state.packing = changedDuringRequest
        ? mergePacking(normalizedServerPacking, state.packing)
        : normalizedServerPacking;

      persistItems();
      persistPacking();
      return changedDuringRequest;
    }

    function stampItem(item, timestamp) {
      if (!item) return item;

      item.updatedAt = timestamp || nowIso();
      item.updatedById = device.id;
      item.updatedByType = device.type;
      item.updatedByLabel = device.label;
      return item;
    }

    function sourceText(item) {
      if (!item || !item.updatedById || item.updatedById === device.id) {
        return "";
      }

      if (item.updatedByLabel) {
        return "Od " + item.updatedByLabel;
      }

      return item.updatedByType === "mobile" ? "Z mobilu" : "Z PC";
    }

    function formatDate(value) {
      if (!value) return "";

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";

      return date.toLocaleString("sk-SK", {
        day: "2-digit",
        month: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function visiblePackingSections() {
      return normalizePacking(state.packing).sections.filter(section => !section.deleted);
    }

    function visiblePackingItems(sectionId) {
      return normalizePacking(state.packing).items.filter(item => !item.deleted && item.sectionId === sectionId);
    }

    function nextPackingSectionOrder() {
      const sections = visiblePackingSections();
      if (!sections.length) return 0;
      return Math.max(...sections.map(section => Number.isFinite(Number(section.order)) ? Number(section.order) : 0)) + 1;
    }

    function nextPackingItemOrder(sectionId) {
      const items = visiblePackingItems(sectionId);
      if (!items.length) return 0;
      return Math.max(...items.map(item => Number.isFinite(Number(item.order)) ? Number(item.order) : 0)) + 1;
    }

    function addPackingSection(name) {
      const clean = String(name || "").trim().slice(0, NAME_LIMIT);
      if (!clean) {
        showToast("Pomenuj sekciu.");
        return false;
      }

      state.packing.sections.push(stampItem({
        id: uid(),
        name: clean,
        order: nextPackingSectionOrder(),
        deleted: false
      }));

      touchLocalRevision();
      persistPacking();
      renderVacation();
      scheduleAutoSave(400);
      return true;
    }

    function renamePackingSection(id) {
      const section = state.packing.sections.find(entry => entry.id === id && !entry.deleted);
      if (!section) return;

      const raw = window.prompt("Nazov sekcie", section.name || "");
      if (raw === null) return;

      const clean = raw.trim().slice(0, NAME_LIMIT);
      if (!clean) {
        showToast("Nazov ostal bez zmeny.");
        return;
      }

      section.name = clean;
      stampItem(section);
      touchLocalRevision();
      persistPacking();
      renderVacation();
      scheduleAutoSave(300);
    }

    function deletePackingSection(id) {
      const section = state.packing.sections.find(entry => entry.id === id && !entry.deleted);
      if (!section) return;

      const timestamp = nowIso();
      section.deleted = true;
      stampItem(section, timestamp);

      state.packing.items.forEach(item => {
        if (item.sectionId === id && !item.deleted) {
          item.deleted = true;
          stampItem(item, timestamp);
        }
      });

      touchLocalRevision();
      persistPacking();
      renderVacation();
      scheduleAutoSave(300);
      showToast("Sekcia vymazana.");
    }

    function addPackingItem(sectionId, name) {
      const clean = String(name || "").trim().slice(0, NAME_LIMIT);
      if (!clean) {
        showToast("Napis, co treba zbalit.");
        return false;
      }

      state.packing.items.push(stampItem({
        id: uid(),
        sectionId: sectionId,
        name: clean,
        packed: false,
        packedAt: null,
        order: nextPackingItemOrder(sectionId),
        deleted: false
      }));

      touchLocalRevision();
      persistPacking();
      renderVacation();
      scheduleAutoSave(350);
      return true;
    }

    function togglePackingItem(id) {
      const item = state.packing.items.find(entry => entry.id === id && !entry.deleted);
      if (!item) return;

      const timestamp = nowIso();
      item.packed = !item.packed;
      item.packedAt = item.packed ? timestamp : null;
      stampItem(item, timestamp);

      touchLocalRevision();
      persistPacking();
      renderVacation();
      scheduleAutoSave(280);
    }

    function deletePackingItem(id) {
      const item = state.packing.items.find(entry => entry.id === id && !entry.deleted);
      if (!item) return;

      item.deleted = true;
      stampItem(item);
      touchLocalRevision();
      persistPacking();
      renderVacation();
      scheduleAutoSave(280);
      showToast("Polozka vymazana.");
    }

    function clearVacationBoard() {
      const sections = state.packing.sections.filter(section => section && !section.deleted);
      const items = state.packing.items.filter(item => item && !item.deleted);
      if (!sections.length && !items.length) {
        showToast("Dovolenka je prazdna.");
        return;
      }

      const confirmed = window.confirm("Naozaj vymazat celu dovolenku?");
      if (!confirmed) {
        return;
      }

      const timestamp = nowIso();
      sections.forEach(section => {
        section.deleted = true;
        stampItem(section, timestamp);
      });
      items.forEach(item => {
        item.deleted = true;
        stampItem(item, timestamp);
      });

      touchLocalRevision();
      persistPacking();
      renderVacation();
      scheduleAutoSave(300);
      showToast("Dovolenkove balenie vymazane.");
    }

    function renderVacation() {
      const board = document.getElementById("vacation-board");
      const clearButton = document.getElementById("btn-clear-vacation");
      if (!board) return;

      board.innerHTML = "";
      const sections = visiblePackingSections();

      if (clearButton) {
        clearButton.disabled = sections.length === 0;
      }

      if (!sections.length) {
        const empty = document.createElement("div");
        empty.className = "vacation-empty";
        empty.innerHTML = [
          "<strong>Zatial nic nebalite</strong>",
          "<div>Pridaj si vlastnu sekciu, napriklad Drogeria alebo Lieky.</div>"
        ].join("");
        board.appendChild(empty);
        return;
      }

      sections.forEach(section => {
        const sectionCard = document.createElement("section");
        sectionCard.className = "vacation-section";

        const head = document.createElement("div");
        head.className = "vacation-section-head";

        const titleWrap = document.createElement("div");
        titleWrap.style.minWidth = "0";

        const titleButton = document.createElement("button");
        titleButton.type = "button";
        titleButton.className = "vacation-section-title";
        titleButton.textContent = section.name;
        titleButton.addEventListener("click", () => {
          renamePackingSection(section.id);
        });

        const meta = document.createElement("div");
        meta.className = "vacation-section-meta";
        const sectionItems = visiblePackingItems(section.id);
        const packedCount = sectionItems.filter(item => item.packed).length;
        meta.textContent = packedCount + "/" + sectionItems.length + " zbalene";

        titleWrap.appendChild(titleButton);
        titleWrap.appendChild(meta);

        const deleteSectionButton = document.createElement("button");
        deleteSectionButton.type = "button";
        deleteSectionButton.className = "item-delete";
        deleteSectionButton.textContent = "X";
        deleteSectionButton.addEventListener("click", () => {
          deletePackingSection(section.id);
        });

        head.appendChild(titleWrap);
        head.appendChild(deleteSectionButton);

        const form = document.createElement("form");
        form.className = "vacation-inline-form";

        const input = document.createElement("input");
        input.className = "mini-input";
        input.type = "text";
        input.autocomplete = "off";
        input.placeholder = "Co treba zbalit?";

        const addButton = document.createElement("button");
        addButton.type = "submit";
        addButton.className = "mini-add";
        addButton.textContent = "+";

        form.appendChild(input);
        form.appendChild(addButton);
        form.addEventListener("submit", event => {
          event.preventDefault();
          const added = addPackingItem(section.id, input.value);
          if (added) {
            input.value = "";
            input.focus();
          }
        });

        const itemsList = document.createElement("div");
        itemsList.className = "vacation-items";

        if (!sectionItems.length) {
          const emptyItems = document.createElement("div");
          emptyItems.className = "vacation-empty";
          emptyItems.style.minHeight = "0";
          emptyItems.style.padding = "14px";
          emptyItems.innerHTML = "<div>Sem si dopisete, co este treba zbalit.</div>";
          itemsList.appendChild(emptyItems);
        } else {
          sectionItems.forEach(item => {
            const row = document.createElement("div");
            row.className = "vacation-item" + (item.packed ? " packed" : "");
            row.addEventListener("click", event => {
              if (event.target.closest("button")) return;
              togglePackingItem(item.id);
            });

            const check = document.createElement("div");
            check.className = "item-check";
            check.textContent = item.packed ? "OK" : "";

            const main = document.createElement("div");
            main.className = "item-main";

            const name = document.createElement("div");
            name.className = "vacation-item-name";
            name.textContent = item.name;
            main.appendChild(name);

            const sub = document.createElement("div");
            sub.className = "vacation-item-sub";

            const source = sourceText(item);
            if (source) {
              const sourceChip = document.createElement("div");
              sourceChip.className = "chip source";
              sourceChip.textContent = source;
              sub.appendChild(sourceChip);
            }

            if (item.packed && item.packedAt) {
              const packedChip = document.createElement("div");
              packedChip.className = "chip";
              packedChip.textContent = formatDate(item.packedAt);
              sub.appendChild(packedChip);
            }

            if (sub.children.length) {
              main.appendChild(sub);
            }

            const del = document.createElement("button");
            del.type = "button";
            del.className = "item-delete";
            del.textContent = "X";
            del.addEventListener("click", event => {
              event.stopPropagation();
              deletePackingItem(item.id);
            });

            row.appendChild(check);
            row.appendChild(main);
            row.appendChild(del);
            itemsList.appendChild(row);
          });
        }

        sectionCard.appendChild(head);
        sectionCard.appendChild(form);
        sectionCard.appendChild(itemsList);
        board.appendChild(sectionCard);
      });
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      if (!toast) return;

      toast.textContent = message;
      toast.classList.add("show");

      if (state.toastTimer) {
        clearTimeout(state.toastTimer);
      }

      state.toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1800);
    }

    function setStatus(mode, text) {
      const pill = document.getElementById("sync-status-pill");
      const label = document.getElementById("sync-status-text");
      if (!pill || !label) return;

      pill.classList.remove("loading", "synced", "saving", "error");
      if (mode) {
        pill.classList.add(mode);
      }
      label.textContent = text;
    }

    function touchSyncSuccess() {
      localStorage.setItem(SYNC_KEY, nowIso());
      state.lastForegroundSyncAt = Date.now();
    }

    function setUnsaved(flag) {
      state.unsaved = Boolean(flag);
      if (state.unsaved) {
        localStorage.setItem(UNSAVED_KEY, "1");
      } else {
        localStorage.removeItem(UNSAVED_KEY);
      }
      updateStatusFromState();
    }

    function updateStatusFromState() {
      if (state.syncInProgress) return;

      if (state.unsaved) {
        if (state.syncTimer) {
          setStatus("saving", "Ukladam...");
          return;
        }
        setStatus("error", "Caka na ulozenie");
        return;
      }

      if (localStorage.getItem(SYNC_KEY)) {
        setStatus("synced", "Aktualne");
        return;
      }

      setStatus("", "Pripravene");
    }

    function updateDeviceUi() {
      const summary = document.getElementById("device-summary");
      const label = device.label || defaultDeviceLabel(device.type);
      const typeText = device.type === "mobile" ? "mobil" : "PC";

      if (summary) {
        summary.textContent = label + " (" + typeText + ")";
      }
    }

    function promptForDeviceName() {
      const suggested = device.label && device.label !== defaultDeviceLabel(device.type)
        ? device.label
        : (device.type === "mobile" ? "Domi" : "Peto");
      const raw = window.prompt("Nazov zariadenia", suggested);
      if (raw === null) return;

      const next = raw.trim().slice(0, 24);
      if (!next) {
        showToast("Nazov ostal bez zmeny.");
        return;
      }

      device.label = next;
      saveDevice();
      updateDeviceUi();
      closeMenu();
      showToast("Zariadenie nastavene.");
    }

    function renderGroup(container, title, className, items) {
      if (!items.length) return;

      const heading = document.createElement("div");
      heading.className = "group-title" + (className ? " " + className : "");
      heading.textContent = title;
      container.appendChild(heading);

      items.forEach(item => {
        container.appendChild(renderItem(item));
      });
    }

    function renderItem(item) {
      const card = document.createElement("div");
      card.className = "item" + (item.bought ? " bought" : "");
      card.dataset.id = item.id;

      card.addEventListener("click", event => {
        if (event.target.closest("button")) return;
        toggleBought(item.id);
      });

      const check = document.createElement("div");
      check.className = "item-check";
      check.textContent = item.bought ? "OK" : "";

      const main = document.createElement("div");
      main.className = "item-main";

      const name = document.createElement("div");
      name.className = "item-name";
      name.textContent = item.name;
      main.appendChild(name);

      const meta = document.createElement("div");
      meta.className = "item-meta";

      const source = sourceText(item);
      if (source) {
        const sourceChip = document.createElement("div");
        sourceChip.className = "chip source";
        sourceChip.textContent = source;
        meta.appendChild(sourceChip);
      }

      if (item.bought && item.boughtAt) {
        const boughtChip = document.createElement("div");
        boughtChip.className = "chip";
        boughtChip.textContent = formatDate(item.boughtAt);
        meta.appendChild(boughtChip);
      }

      if (meta.children.length) {
        main.appendChild(meta);
      }

      const del = document.createElement("button");
      del.type = "button";
      del.className = "item-delete";
      del.textContent = "X";
      del.addEventListener("click", event => {
        event.stopPropagation();
        deleteSingle(item.id);
      });

      card.appendChild(check);
      card.appendChild(main);
      card.appendChild(del);
      return card;
    }

    function render() {
      const list = document.getElementById("list");
      if (!list) return;

      list.innerHTML = "";
      const items = visibleItems();

      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML = [
          '<div class="empty-title">Zoznam je prazdny</div>',
          '<div>Pridaj prvu polozku a dalej to pojde samo.</div>'
        ].join("");
        list.appendChild(empty);
        updateBulkActionState();
        return;
      }

      const open = items.filter(item => !item.bought);
      const done = items.filter(item => item.bought);

      renderGroup(list, "Kupit", "", open);
      renderGroup(list, "Kupene", "done", done);
      updateBulkActionState();
    }

    function updateBulkActionState() {
      const markAllButton = document.getElementById("btn-mark-all");
      const clearCheckedButton = document.getElementById("btn-clear-checked");
      if (!markAllButton || !clearCheckedButton) return;

      const items = visibleItems();
      markAllButton.disabled = !items.some(item => !item.bought);
      clearCheckedButton.disabled = !items.some(item => item.bought);
    }

    function nextTopOrder() {
      const items = visibleItems();
      if (!items.length) return 0;
      return Math.min(...items.map(item => Number.isFinite(Number(item.order)) ? Number(item.order) : 0)) - 1;
    }

    function scheduleAutoSave(delay) {
      if (state.syncTimer) {
        clearTimeout(state.syncTimer);
      }

      setUnsaved(true);
      setStatus("saving", "Ukladam...");

      state.syncTimer = setTimeout(() => {
        state.syncTimer = null;
        flushAutoSave(false);
      }, typeof delay === "number" ? delay : AUTO_SAVE_DELAY);
    }

    function queueFollowupSync() {
      state.syncQueued = true;
    }

    function flushAutoSave(showFeedback) {
      if (!state.unsaved) {
        return Promise.resolve(true);
      }

      if (state.syncTimer) {
        clearTimeout(state.syncTimer);
        state.syncTimer = null;
      }

      if (state.syncInProgress) {
        queueFollowupSync();
        return Promise.resolve(false);
      }

      return saveToSheets(Boolean(showFeedback));
    }

    function addItem(name) {
      const clean = String(name || "").trim();
      if (!clean) {
        showToast("Napis, co treba kupit.");
        return;
      }

      state.items.unshift(stampItem({
        id: uid(),
        name: clean,
        bought: false,
        boughtAt: null,
        deleted: false,
        order: nextTopOrder()
      }));

      touchLocalRevision();
      persistItems();
      render();
      scheduleAutoSave();
    }

    function toggleBought(id) {
      const item = state.items.find(entry => entry.id === id);
      if (!item || item.deleted) return;

      const timestamp = nowIso();
      item.bought = !item.bought;
      item.boughtAt = item.bought ? timestamp : null;
      stampItem(item, timestamp);
      touchLocalRevision();
      persistItems();
      render();
      scheduleAutoSave(500);
    }

    function deleteSingle(id) {
      const item = state.items.find(entry => entry.id === id);
      if (!item || item.deleted) return;

      item.deleted = true;
      stampItem(item);
      touchLocalRevision();
      persistItems();
      render();
      scheduleAutoSave(500);
      showToast("Polozka vymazana.");
    }

    function markAllBought() {
      const items = state.items.filter(item => item && !item.deleted && !item.bought);
      if (!items.length) {
        showToast("Nie je co oznacit.");
        return;
      }

      const timestamp = nowIso();
      items.forEach(item => {
        item.bought = true;
        item.boughtAt = timestamp;
        stampItem(item, timestamp);
      });

      touchLocalRevision();
      persistItems();
      render();
      scheduleAutoSave(400);
      closeMenu();
      showToast("Vsetko je oznacene.");
    }

    function clearChecked() {
      const items = state.items.filter(item => item && item.bought && !item.deleted);
      if (!items.length) {
        showToast("Nie je co vymazat.");
        return;
      }

      const timestamp = nowIso();
      items.forEach(item => {
        item.deleted = true;
        stampItem(item, timestamp);
      });

      touchLocalRevision();
      persistItems();
      render();
      scheduleAutoSave(400);
      closeMenu();
      showToast("Oznacene polozky vymazane.");
    }

    function parseSyncPayload(data) {
      if (Array.isArray(data)) {
        return {
          items: normalizeItems(data),
          packing: { sections: [], items: [] }
        };
      }

      return {
        items: data && Array.isArray(data.items) ? normalizeItems(data.items) : [],
        packing: data && data.packing ? normalizePacking(data.packing) : { sections: [], items: [] }
      };
    }

    function fetchRemoteData() {
      const attempts = [
        () => fetch(SHEETS_SYNC_URL + "?action=get", { method: "GET", cache: "no-store" }),
        () => fetch(SHEETS_SYNC_URL + "?action=load", { method: "GET", cache: "no-store" }),
        () => fetch(SHEETS_SYNC_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "get" })
        })
      ];

      let index = 0;
      let lastError = null;

      function runNext() {
        if (index >= attempts.length) {
          return Promise.reject(lastError || new Error("Sheets sync is unavailable."));
        }

        return attempts[index++]()
          .then(response => {
            if (!response.ok) {
              throw new Error("HTTP " + response.status);
            }

            return response.json().catch(() => {
              throw new Error("Invalid JSON response.");
            });
          })
          .then(data => {
            if (data && data.ok === false) {
              throw new Error(data.error || "Sheets sync error.");
            }

            if (Array.isArray(data) || (data && (Array.isArray(data.items) || data.packing))) {
              return parseSyncPayload(data);
            }

            throw new Error("Unexpected sync response.");
          })
          .catch(error => {
            lastError = error;
            return runNext();
          });
      }

      return runNext();
    }

    function loadFromSheets(showFeedback) {
      if (state.syncInProgress) return Promise.resolve(false);
      if (state.unsaved) {
        return flushAutoSave(showFeedback);
      }

      const requestRevision = state.localRevision;
      state.syncInProgress = true;
      setStatus("loading", "Nacitavam...");

      return fetchRemoteData()
        .then(remoteSnapshot => {
          const changedDuringRequest = applyServerSnapshot(remoteSnapshot, requestRevision);
          touchSyncSuccess();
          render();
          renderVacation();

          if (changedDuringRequest) {
            setUnsaved(true);
            scheduleAutoSave(250);
            if (showFeedback) {
              showToast("Nacitane, tvoje zmeny sa este ukladaju.");
            }
            return true;
          }

          setUnsaved(false);
          setStatus("synced", "Aktualne");
          if (showFeedback) {
            showToast("Nacitane zo Sheets.");
          }
          return true;
        })
        .catch(error => {
          console.error(error);
          setStatus("error", "Nacitavanie zlyhalo");
          if (showFeedback) {
            showToast("Nacitavanie zlyhalo.");
          }
          return false;
        })
        .finally(() => {
          state.syncInProgress = false;
          updatePullIndicator(0, false);
          updateStatusFromState();
        });
    }

    function saveToSheets(showFeedback) {
      if (state.syncInProgress) return Promise.resolve(false);

      const requestRevision = state.localRevision;
      const localSnapshot = {
        items: normalizeItems(state.items),
        packing: normalizePacking(state.packing)
      };
      state.syncInProgress = true;
      setStatus("loading", "Ukladam...");

      return fetchRemoteData()
        .then(remoteSnapshot => {
          const merged = {
            items: normalizeItems([
              ...(((remoteSnapshot && remoteSnapshot.items) || [])),
              ...((localSnapshot && localSnapshot.items) || [])
            ]),
            packing: mergePacking(
              remoteSnapshot && remoteSnapshot.packing,
              localSnapshot && localSnapshot.packing
            )
          };

          return fetch(SHEETS_SYNC_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              action: "sync",
              items: merged.items,
              packing: merged.packing
            })
          })
            .then(response => {
              if (!response.ok) {
                throw new Error("HTTP " + response.status);
              }

              return response.json().catch(() => ({}));
            })
            .then(data => {
              if (data && data.ok === false) {
                throw new Error(data.error || "Sheets sync error.");
              }

              if (Array.isArray(data) || (data && (Array.isArray(data.items) || data.packing))) {
                return parseSyncPayload(data);
              }

              return merged;
            });
        })
        .then(finalSnapshot => {
          const changedDuringRequest = applyServerSnapshot(finalSnapshot, requestRevision);
          touchSyncSuccess();
          render();
          renderVacation();

          if (changedDuringRequest) {
            setUnsaved(true);
            scheduleAutoSave(250);
            if (showFeedback) {
              showToast("Ulozene, dalsie zmeny sa este ukladaju.");
            }
            return true;
          }

          setUnsaved(false);
          setStatus("synced", "Aktualne");
          if (showFeedback) {
            showToast("Ulozene.");
          }
          return true;
        })
        .catch(error => {
          console.error(error);
          setStatus("error", "Ukladanie zlyhalo");
          if (showFeedback) {
            showToast("Ulozenie zlyhalo.");
          }
          return false;
        })
        .finally(() => {
          state.syncInProgress = false;
          updateStatusFromState();
          if (state.syncQueued) {
            state.syncQueued = false;
            if (state.unsaved) {
              scheduleAutoSave(350);
            }
          }
        });
    }

    function refreshFromForeground(force) {
      const now = Date.now();
      if (!force && now - state.lastForegroundSyncAt < FOREGROUND_SYNC_GAP) {
        return Promise.resolve(false);
      }

      if (state.unsaved) {
        return flushAutoSave(false);
      }

      return loadFromSheets(false);
    }

    function updatePullIndicator(distance, loading) {
      const indicator = document.getElementById("pull-indicator");
      if (!indicator) return;

      if (loading) {
        indicator.classList.add("active");
        indicator.textContent = "Nacitavam...";
        return;
      }

      if (!distance) {
        indicator.classList.remove("active");
        indicator.textContent = "Pusti pre obnovenie";
        return;
      }

      indicator.classList.add("active");
      indicator.textContent = distance >= PULL_THRESHOLD ? "Pusti pre obnovenie" : "Potiahni este trochu";
    }

    function bindPullToRefresh() {
      document.addEventListener("touchstart", event => {
        if (state.syncInProgress) return;
        if (window.scrollY > 0) return;
        if (event.target.closest("button, input, .menu-sheet")) return;

        const touch = event.touches && event.touches[0];
        if (!touch) return;

        state.pull = {
          startY: touch.clientY,
          distance: 0
        };
      }, { passive: true });

      document.addEventListener("touchmove", event => {
        if (!state.pull) return;

        const touch = event.touches && event.touches[0];
        if (!touch) return;

        const delta = touch.clientY - state.pull.startY;
        if (delta <= 0 || window.scrollY > 0) {
          state.pull = null;
          updatePullIndicator(0, false);
          return;
        }

        state.pull.distance = Math.min(120, delta * 0.7);
        updatePullIndicator(state.pull.distance, false);
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("touchend", () => {
        if (!state.pull) return;

        const shouldRefresh = state.pull.distance >= PULL_THRESHOLD;
        state.pull = null;

        if (shouldRefresh) {
          updatePullIndicator(PULL_THRESHOLD, true);
          refreshFromForeground(true);
          return;
        }

        updatePullIndicator(0, false);
      }, { passive: true });

      document.addEventListener("touchcancel", () => {
        state.pull = null;
        updatePullIndicator(0, false);
      }, { passive: true });
    }

    function openMenu() {
      if (state.vacationOpen) {
        closeVacation();
      }

      const backdrop = document.getElementById("menu-backdrop");
      const sheet = document.getElementById("menu-sheet");
      if (!backdrop || !sheet) return;

      state.menuOpen = true;
      backdrop.hidden = false;
      requestAnimationFrame(() => {
        backdrop.classList.add("open");
        sheet.classList.add("open");
        sheet.setAttribute("aria-hidden", "false");
      });
    }

    function closeMenu() {
      const backdrop = document.getElementById("menu-backdrop");
      const sheet = document.getElementById("menu-sheet");
      if (!backdrop || !sheet) return;

      state.menuOpen = false;
      backdrop.classList.remove("open");
      sheet.classList.remove("open");
      sheet.setAttribute("aria-hidden", "true");
      setTimeout(() => {
        if (!state.menuOpen) {
          backdrop.hidden = true;
        }
      }, 220);
    }

    function openVacation() {
      if (state.menuOpen) {
        closeMenu();
      }

      const backdrop = document.getElementById("vacation-backdrop");
      const modal = document.getElementById("vacation-modal");
      if (!backdrop || !modal) return;

      state.vacationOpen = true;
      renderVacation();
      backdrop.hidden = false;
      requestAnimationFrame(() => {
        backdrop.classList.add("open");
        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
      });
    }

    function closeVacation() {
      const backdrop = document.getElementById("vacation-backdrop");
      const modal = document.getElementById("vacation-modal");
      if (!backdrop || !modal) return;

      state.vacationOpen = false;
      backdrop.classList.remove("open");
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      setTimeout(() => {
        if (!state.vacationOpen) {
          backdrop.hidden = true;
        }
      }, 220);
    }

    function registerServiceWorker() {
      if (!("serviceWorker" in navigator)) return;

      let refreshing = false;

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      navigator.serviceWorker.register("./service-worker.js")
        .then(registration => registration.update())
        .catch(error => {
          console.error(error);
        });
    }

    function bindEvents() {
      document.getElementById("add-form").addEventListener("submit", event => {
        event.preventDefault();
        const input = document.getElementById("input-name");
        addItem(input.value);
        input.value = "";
        input.focus();
      });

      document.getElementById("btn-vacation").addEventListener("click", openVacation);
      document.getElementById("btn-menu").addEventListener("click", openMenu);
      document.getElementById("btn-close-menu").addEventListener("click", closeMenu);
      document.getElementById("menu-backdrop").addEventListener("click", closeMenu);
      document.getElementById("btn-close-vacation").addEventListener("click", closeVacation);
      document.getElementById("vacation-backdrop").addEventListener("click", closeVacation);
      document.getElementById("btn-device").addEventListener("click", promptForDeviceName);
      document.getElementById("btn-refresh").addEventListener("click", () => {
        closeMenu();
        refreshFromForeground(true).then(result => {
          if (result) {
            showToast("Obnovene.");
          }
        });
      });
      document.getElementById("btn-sync-now").addEventListener("click", () => {
        closeMenu();
        flushAutoSave(true);
      });
      document.getElementById("btn-mark-all").addEventListener("click", markAllBought);
      document.getElementById("btn-clear-checked").addEventListener("click", clearChecked);
      document.getElementById("btn-clear-vacation").addEventListener("click", clearVacationBoard);
      document.getElementById("vacation-section-form").addEventListener("submit", event => {
        event.preventDefault();
        const input = document.getElementById("vacation-section-name");
        const added = addPackingSection(input.value);
        if (added) {
          input.value = "";
          input.focus();
        }
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          if (state.menuOpen) {
            closeMenu();
          }
          if (state.vacationOpen) {
            closeVacation();
          }
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          refreshFromForeground(false);
        }
      });

      window.addEventListener("focus", () => {
        refreshFromForeground(false);
      });

      window.addEventListener("online", () => {
        refreshFromForeground(true);
      });
    }

    function boot() {
      state.items = loadLocalItems();
      state.packing = loadLocalPacking();

      updateDeviceUi();
      render();
      renderVacation();
      updateStatusFromState();
      bindEvents();
      bindPullToRefresh();
      registerServiceWorker();

      if (state.unsaved) {
        scheduleAutoSave(600);
      } else {
        loadFromSheets(false);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  </script>
</body>
