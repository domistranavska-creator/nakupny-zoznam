<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7fbf8">
  <meta name="description" content="Spoločný nákupný zoznam, kalendár a úlohy pre Domi a Peťa.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon_android_xxxhdpi_192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Spolu</title>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="app-header">
      <div class="brand">
        <h1 id="section-title">Nákup</h1>
      </div>
      <div class="header-actions">
        <button class="sync-chip" id="sync-chip" type="button" aria-label="Synchronizovať teraz">
          <span class="sync-dot"></span>
          <span id="sync-text">Pripravené</span>
        </button>
        <button class="avatar-button" id="open-settings" type="button" aria-label="Nastavenia">
          <span class="settings-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>
      </div>
    </header>

    <div class="pull-indicator" id="pull-indicator" aria-live="polite">Potiahni pre obnovenie</div>

    <section class="view active" id="view-shopping" data-view="shopping">
      <form class="quick-composer" id="shopping-form">
        <div class="composer-input-wrap">
          <input id="shopping-input" type="text" maxlength="80" autocomplete="off" enterkeyhint="next" placeholder="Čo treba kúpiť?">
          <div class="suggestions" id="shopping-suggestions" hidden></div>
        </div>
        <button class="add-button" type="submit" aria-label="Pridať položku">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </form>

      <div class="content-list" id="shopping-list"></div>

      <div class="bulk-actions" id="shopping-bulk">
        <button type="button" id="mark-all-shopping">Označiť všetko</button>
        <button type="button" class="danger-text" id="clear-shopping">Vymazať kúpené</button>
      </div>
    </section>

    <section class="view" id="view-calendar" data-view="calendar" hidden>
      <section class="today-panel" aria-labelledby="today-heading">
        <div class="today-panel-head">
          <div>
            <p class="today-label">Dnes</p>
            <h2 id="today-heading">Dnešný program</h2>
            <span id="today-date-label"></span>
          </div>
          <button class="compact-add today-add" id="add-today-event" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Udalosť
          </button>
        </div>
        <div class="agenda-list today-list" id="today-list"></div>
      </section>

      <div class="calendar-toolbar">
        <button class="month-arrow" id="calendar-prev" type="button" aria-label="Predchádzajúci mesiac">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button class="month-title" id="calendar-today" type="button">
          <span id="calendar-month">September 2026</span>
          <small>Dnes</small>
        </button>
        <button class="month-arrow" id="calendar-next" type="button" aria-label="Nasledujúci mesiac">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <div class="calendar-card">
        <div class="weekdays" aria-hidden="true">
          <span>Po</span><span>Ut</span><span>St</span><span>Št</span><span>Pi</span><span>So</span><span>Ne</span>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>

      <section class="selected-agenda" id="selected-agenda-section" hidden>
        <div class="agenda-head">
          <div>
            <p class="section-kicker">Vybraný deň</p>
            <h2 id="selected-date-title"></h2>
          </div>
          <button class="compact-add" id="add-event" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Udalosť
          </button>
        </div>
        <div class="agenda-list" id="agenda-list"></div>
      </section>

      <section class="upcoming-section">
        <div class="upcoming-heading">
          <div>
            <p class="section-kicker">Ďalšie dni</p>
            <h3>Čo nás čaká</h3>
          </div>
          <span id="upcoming-count">0 udalostí</span>
        </div>
        <div class="upcoming-list" id="upcoming-list"></div>
      </section>
    </section>

    <section class="view" id="view-tasks" data-view="tasks" hidden>
      <form class="task-composer" id="task-form">
        <div class="task-entry-row">
          <input id="task-input" type="text" maxlength="100" autocomplete="off" enterkeyhint="next" placeholder="Napíš novú úlohu">
          <button class="add-button coral" type="submit" aria-label="Pridať úlohu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div class="task-options">
          <label class="option-pill">
            <span class="priority-dot"></span>
            <select id="task-priority" aria-label="Priorita">
              <option value="normal">Bežná</option>
              <option value="high">Dôležitá</option>
              <option value="low">Keď bude čas</option>
            </select>
          </label>
          <label class="option-pill assignee-option">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM17 11l2 2 4-4"/></svg>
            <select id="task-assignee" aria-label="Komu patrí úloha">
              <option value="both">Pre oboch</option>
              <option value="domi">Pre Domi</option>
              <option value="peto">Pre Peťa</option>
            </select>
          </label>
        </div>
      </form>

      <div class="content-list" id="task-list"></div>

      <div class="bulk-actions single" id="task-bulk">
        <button type="button" class="danger-text" id="clear-tasks">Vymazať hotové</button>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="Hlavná navigácia">
      <button class="nav-item active" type="button" data-target="shopping">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L20.3 8H6.1M9 20h.01M17 20h.01"/></svg>
        <span>Nákup</span>
      </button>
      <button class="nav-item" type="button" data-target="calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        <span>Kalendár</span>
      </button>
      <button class="nav-item" type="button" data-target="tasks">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 2 2 4-4M12 7h8M4 14l2 2 4-4M12 14h8M4 21l2 2 4-4M12 21h8"/></svg>
        <span>Úlohy</span>
      </button>
    </nav>
  </main>

  <div class="modal-backdrop" id="event-backdrop" hidden></div>
  <aside class="bottom-sheet" id="event-sheet" aria-hidden="true">
    <div class="sheet-grabber" aria-hidden="true"></div>
    <header class="sheet-header">
      <div>
        <p class="section-kicker">Spoločný kalendár</p>
        <h2 id="event-sheet-title">Nová udalosť</h2>
      </div>
      <button class="close-button" id="close-event" type="button" aria-label="Zavrieť">×</button>
    </header>
    <form id="event-form" class="event-form">
      <input id="event-id" type="hidden">
      <label class="field wide">
        <span>Názov</span>
        <input id="event-title" type="text" maxlength="100" required autocomplete="off" placeholder="Napr. Zubár alebo večera">
      </label>
      <label class="field">
        <span>Dátum</span>
        <input id="event-date" type="date" required>
      </label>
      <label class="switch-field">
        <span>Celý deň</span>
        <input id="event-all-day" type="checkbox">
        <i aria-hidden="true"></i>
      </label>
      <div class="time-fields" id="event-time-fields">
        <label class="field"><span>Od</span><input id="event-start" type="time"></label>
        <label class="field"><span>Do</span><input id="event-end" type="time"></label>
      </div>
      <label class="field wide">
        <span>Poznámka <small>nepovinné</small></span>
        <textarea id="event-note" maxlength="300" rows="3" placeholder="Adresa alebo niečo dôležité"></textarea>
      </label>
      <fieldset class="assignee-field">
        <legend>Pre koho <small>predvolene obaja</small></legend>
        <div class="assignee-choices">
          <label><input type="radio" name="event-assignee" value="both" checked><span>Obaja</span></label>
          <label><input type="radio" name="event-assignee" value="domi"><span>Domi</span></label>
          <label><input type="radio" name="event-assignee" value="peto"><span>Peťo</span></label>
        </div>
      </fieldset>
      <fieldset class="color-field">
        <legend>Farba</legend>
        <label><input type="radio" name="event-color" value="aqua" checked><span class="aqua"></span></label>
        <label><input type="radio" name="event-color" value="coral"><span class="coral"></span></label>
        <label><input type="radio" name="event-color" value="sun"><span class="sun"></span></label>
        <label><input type="radio" name="event-color" value="leaf"><span class="leaf"></span></label>
        <label><input type="radio" name="event-color" value="blue"><span class="blue"></span></label>
      </fieldset>
      <div class="sheet-form-actions">
        <button class="delete-button" id="delete-event" type="button" hidden>Vymazať</button>
        <button class="save-button" type="submit">Uložiť udalosť</button>
      </div>
    </form>
  </aside>

  <div class="modal-backdrop" id="settings-backdrop" hidden></div>
  <aside class="bottom-sheet compact-sheet" id="settings-sheet" aria-hidden="true">
    <div class="sheet-grabber" aria-hidden="true"></div>
    <header class="sheet-header">
      <div>
        <p class="section-kicker">Toto zariadenie</p>
        <h2>Nastavenia</h2>
      </div>
      <button class="close-button" id="close-settings" type="button" aria-label="Zavrieť">×</button>
    </header>
    <div class="settings-body">
      <label class="field wide">
        <span>Kto ho používa?</span>
        <input id="device-name" type="text" maxlength="24" autocomplete="off" placeholder="Domi alebo Peťo">
      </label>
      <div class="person-shortcuts">
        <button type="button" data-person="Domi">Domi</button>
        <button type="button" data-person="Peťo">Peťo</button>
      </div>
      <div class="settings-actions">
        <button id="save-device" class="save-button" type="button">Uložiť meno</button>
        <button id="sync-now" class="secondary-button" type="button">Synchronizovať teraz</button>
      </div>
      <p class="settings-note">Zmeny sa ukladajú automaticky. Ručná synchronizácia je len poistka.</p>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
